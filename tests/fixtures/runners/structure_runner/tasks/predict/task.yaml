id: structure_runner
display_name: Synthetic structure_runner
category: analysis
summary: Synthetic protocol behavior.
inputs:
  structure:
    title: Structure
    type: protein_structure
    formats:
    - pdb
    - cif
    cardinality:
      min: 1
      max: 1
parameters:
  type: object
  additionalProperties: false
  properties:
    iter:
      type: integer
      default: 100
      minimum: 1
      maximum: 10000
      description: Synthetic bounded control for protocol validation.
    evalue:
      type: string
      default: 1E-10
      description: Synthetic bounded control for protocol validation.
    mact:
      type: number
      default: 0.35
      minimum: 0
      maximum: 1
      description: Synthetic bounded control for protocol validation.
    maxfilt:
      type: integer
      default: 100000000
      minimum: 1
      description: Synthetic bounded control for protocol validation.
    neffmax:
      type: number
      default: 20
      minimum: 1
      description: Synthetic bounded control for protocol validation.
    num_iterations:
      type: integer
      default: 3
      minimum: 1
      maximum: 10
      description: Synthetic bounded control for protocol validation.
stage_markers:
  hhblits: Collect input
  hhfilter: Filter input
  cpu_runner: Calculate result
  blast: Export profile
