id: cpu_runner
display_name: Synthetic cpu_runner
category: analysis
summary: Synthetic protocol behavior.
inputs:
  sequence:
    title: Sequence
    type: protein_sequence
    formats:
    - fasta
    cardinality:
      min: 1
      max: 1
input_workspace:
  steps:
  - id: material
    title: Material
    capabilities:
    - plugin: files
      id: source_files
      title: Input
    - plugin: sequence
      id: sequence_editor
      title: Sequence
      options:
        role: sequence
  - id: settings
    title: Settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Controls
  - id: review
    title: Review
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options:
        show_paths: true
parameters:
  type: object
  additionalProperties: false
  properties:
    iter:
      type: integer
      default: 100
      minimum: 1
      maximum: 10000
      description: Synthetic bounded control for protocol validation.
    seed:
      type: integer
      default: 0
      minimum: 0
      description: Synthetic seed control.
      x-ui-control:
        kind: seed
    mass_precision:
      type: integer
      minimum: 0
      maximum: 6
      default: 2
      description: Synthetic bounded precision.
    offset:
      type: number
      description: Synthetic unbounded offset.
stage_markers:
  hhblits: Collect input
  hhfilter: Filter input
  cpu_runner: Calculate result
  blast: Export profile
