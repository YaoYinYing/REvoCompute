id: profile_runner
display_name: Synthetic profile_runner
category: analysis
summary: Synthetic protocol behavior.
inputs:
  sequence:
    title: Sequence
    type: protein_sequence
    formats:
    - fasta
    cardinality:
      min: 1
      max: 1
input_workspace:
  steps:
  - id: material
    title: Material
    capabilities:
    - plugin: files
      id: source_files
      title: Input
    - plugin: sequence
      id: sequence_editor
      title: Sequence
      options:
        role: sequence
  - id: settings
    title: Settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Controls
  - id: review
    title: Review
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options:
        show_paths: true
parameters:
  type: object
  additionalProperties: false
  properties:
    iter:
      type: integer
      default: 100
      minimum: 1
      maximum: 10000
      description: Synthetic bounded control for protocol validation.
    reaction_smiles:
      type: string
      default: ''
      description: Synthetic text parameter.
stage_markers:
  hhblits: Collect input
  hhfilter: Filter input
  cpu_runner: Calculate result
  blast: Export profile
result_workspace:
  views:
  - plugin: entity-table
    id: active_sites
    role: primary
    title: Mapped entities
    sources:
      table:
      - path: active_sites.csv
        required: true
      structure:
      - path: enzyme_structure.pdb
        required: true
    mapping:
      entity: residue
      key_columns:
      - chain
      - residue_index
      label_column: site_name
      chain_column: chain
      residue_column: residue_index
      numbering: label_seq_id
      evidence_columns:
      - site_class
      - probabilities
    description: Synthetic generic entity projection.
