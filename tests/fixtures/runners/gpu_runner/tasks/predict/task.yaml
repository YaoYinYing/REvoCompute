id: gpu_runner
display_name: Synthetic gpu_runner
category: analysis
summary: Synthetic protocol behavior.
inputs:
  sequence:
    title: Sequence
    type: protein_sequence
    formats:
    - fasta
    cardinality:
      min: 1
      max: 1
input_workspace:
  steps:
  - id: material
    title: Material
    capabilities:
    - plugin: files
      id: source_files
      title: Input
    - plugin: sequence
      id: sequence_editor
      title: Sequence
      options:
        role: sequence
  - id: settings
    title: Settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Controls
  - id: review
    title: Review
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options:
        show_paths: true
parameters:
  type: object
  additionalProperties: false
  properties:
    iter:
      type: integer
      default: 100
      minimum: 1
      maximum: 10000
      description: Synthetic bounded control for protocol validation.
stage_markers:
  hhblits: Collect input
  hhfilter: Filter input
  cpu_runner: Calculate result
  blast: Export profile
gpus: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: structures
    role: primary
    title: Synthetic candidates
    description: Generic structure display contract.
    sources:
      candidates:
      - glob: ranked/*.cif
        required: false
    mapping:
      confidence_encoding: plddt_bfactor
