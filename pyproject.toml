[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "revocompute"
version = "0.1.0"
description = "REvoCompute — multi-task compute server with Flask + Celery + Docker runners"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"

[project.scripts]
revocompute-doctor = "revocompute.doctor:main"

dependencies = [
    "APScheduler>=3.11,<4",
    "biotite>=1.7.1,<2",
    "celery[redis]>=5.3",
    "numpy>=2.5,<3",
    "docker>=7.1",
    "Flask>=3.1",
    "gunicorn>=25.1",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "redis>=5.0",
    "SQLAlchemy>=2.0",
    "werkzeug",
    "itsdangerous",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
resend = [
    "resend>=2.0",
]
test = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "pytest-cov>=6",
    "requests>=2.33",
    "pytest-playwright>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["revocompute*"]

[tool.setuptools.package-data]
revocompute = [
    "templates/**",
    "templates/images/*",
    "static/*.json",
    "static/css/*",
    "static/js/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
