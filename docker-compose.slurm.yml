# SLURM override — merged automatically when the selected task registry sets
# job_executor: slurm. This file is version-controlled but otherwise inactive.
#
# It bind-mounts:
#   - Host SLURM client tools + libraries → worker (sbatch, squeue, etc.)
#   - MUNGE socket → worker (SLURM authentication)
#   - CONFIG_DIR → web, worker, maintenance (task type + runner YAMLs)

services:
  redis:
    # Publish on a non-default port so the host-networked worker can reach
    # Redis via localhost.  Loopback-only: never expose the broker on other
    # host interfaces — it is authenticated, but it is still the task
    # control plane.
    ports:
      - "127.0.0.1:${SLURM_REDIS_PORT:-6380}:6379"

  web:
    volumes:
      - ${CONFIG_DIR}:${CONFIG_DIR}:ro

  maintenance:
    volumes:
      - ${CONFIG_DIR}:${CONFIG_DIR}:ro

  worker:
    network_mode: host
    # Host-networked → can't resolve Docker DNS "redis".  Use the published
    # port (6380 → container:6379) via localhost.  REDIS_PASSWORD is provided
    # by restart.sh through the deployment env file.
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:${SLURM_REDIS_PORT:-6380}/0
      BROKER_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:${SLURM_REDIS_PORT:-6380}/0
      RESULT_BACKEND: redis://:${REDIS_PASSWORD}@127.0.0.1:${SLURM_REDIS_PORT:-6380}/0
    volumes:
      - ${CONFIG_DIR}:${CONFIG_DIR}:ro
      - ${SBATCH_BIN:-/usr/bin/sbatch}:/usr/bin/sbatch:ro
      - ${SQUEUE_BIN:-/usr/bin/squeue}:/usr/bin/squeue:ro
      - ${SCANCEL_BIN:-/usr/bin/scancel}:/usr/bin/scancel:ro
      - ${SACCT_BIN:-/usr/bin/sacct}:/usr/bin/sacct:ro
      - ${SINFO_BIN:-/usr/bin/sinfo}:/usr/bin/sinfo:ro
      - ${SRUN_BIN:-/usr/bin/srun}:/usr/bin/srun:ro
      - ${APPTAINER_BIN:-/usr/bin/apptainer}:/usr/bin/apptainer:ro
      - ${SLURM_LIB_DIR:-/usr/lib/x86_64-linux-gnu/slurm-wlm}:/usr/lib/x86_64-linux-gnu/slurm-wlm:ro
      - ${SLURM_CONFIG_DIR:-/etc/slurm-llnl}:/etc/slurm-llnl:ro
      - ${MUNGE_RUN_DIR:-/run/munge}:/run/munge:ro
      - ${MUNGE_LIB:-/lib/x86_64-linux-gnu/libmunge.so.2}:/lib/x86_64-linux-gnu/libmunge.so.2:ro
