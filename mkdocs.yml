site_name: REvoCompute Documentation
site_description: Operations, API, and runtime-family documentation for REvoCompute
repo_name: REvoCompute
docs_dir: docs
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
validation:
  nav:
    # A page that exists but is missing from nav is unpublished; fail the build.
    omitted_files: warn
  links:
    absolute_links: ignore
    # A link to a heading that no longer exists must not ship silently.
    anchors: warn
nav:
  - Home: index.md
  - User Guide:
      - Overview: user-guide/index.md
      - Submitting Tasks: user-guide/submitting-tasks.md
      - Task States and Result Delivery: user-guide/task-states.md
      - Results: user-guide/results.md
      - Access and Runner Availability: user-guide/access-and-runner-availability.md
  - Operator Guide:
