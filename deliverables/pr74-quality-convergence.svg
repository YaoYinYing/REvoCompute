  <title>PR #74 quality convergence: new verified actionable findings, unresolved approved findings, and reopened or campaign-introduced regressions by campaign round R0 to R10</title>
  <desc>Line chart of the PR #74 visual-QA campaign, baseline round R0 to final head 98184006. New verified actionable findings: 0, 4, 0, 1, 0, 31, 0, 0, 0, 1, 6. The round-5 spike is the eleven-explorer fan-out, the only round that swept the whole product, so 31 defects were verified there that the four-surface rounds could not see. Remaining unresolved approved findings at the end of each round: 0, 4, 2, 3, 1, 29, 8, 3, 0, 1, 0; all 43 verified defects are closed at the delivered head. Reopened defects and confirmed regressions: 0 at every round except 2 at round 3 and 3 at round 10, of which only the round-3 pair were previously verified. Rounds R0, R2, R4, R7 and R8 ran no discovery sweep, so a zero there means not examined. Four defects were deliberately left unfixed and maintainer-held and are excluded from the series, including the SYS-1 40-cell font-independent class. The campaign did not converge to zero by closure; it uncovered a class it left open. Not merged.</desc>
