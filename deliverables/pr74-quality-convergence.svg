  <text x="36" y="538" font-size="9.5" fill="#52514e">New = findings each round first verified as actionable. Open = those still unresolved at the round&#8217;s end. All 43 verified defects are closed at head 98184006; 0 remain open.</text>
  <text x="36" y="553" font-size="9.5" fill="#52514e">The reopened series is an overlay, not a fourth bucket. Round 10&#8217;s six new defects are all campaign-introduced (font-sensitive CI cases + 2 self-inflicted live-region/a11y regressions); only 1 is a round-7 regression.</text>
  <text x="36" y="568" font-size="9.5" fill="#52514e">4 verified defects were deliberately left unfixed and maintainer-held (M5-03, I-D-TABLE-IDENTITY, J-02, the main-landmark/skip-link proposal) and are excluded from every series.</text>
  <text x="36" y="583" font-size="9.5" fill="#52514e">SYS-1 itself is not plotted: a 40-cell font-INDEPENDENT class (text-only 200% resize at 280&#8211;360px) that the campaign fixed symptoms of and explicitly does NOT claim to have fixed.</text>
  <text x="36" y="598" font-size="9.5" fill="#52514e">Not merged. No force-push. No scientific or API semantics changed. Evidence revision: campaign head 98184006, branch chore/visual-qa-campaign-plan.</text>
