name: REvoCompute Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One classifier decides which validation lanes a change set can affect
  # (tools/classify_ci_scope.py is the single source of truth for that policy).
  # The job is deliberately fail-closed: if the classifier errors, is skipped, or
  # produces nothing, every lane below runs. Each gated job therefore tests
  # `!= 'false'` rather than `== 'true'`, so a missing output can only widen
  # validation, never silently skip it. The workflow stays triggered on its normal
  # events so the other jobs are still created (skipped, not absent).
  ClassifyChanges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.classify.outputs.lanes }}
      server: ${{ steps.classify.outputs.server }}
      runner_scientific: ${{ steps.classify.outputs.runner_scientific }}
      browser: ${{ steps.classify.outputs.browser }}
      compose: ${{ steps.classify.outputs.compose }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify Change Set
        id: classify
        # A classification failure must not skip validation, so the step is
        # non-fatal and the next step restores the broad default.
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # push (and any other ref-based event): diff against the previous tip.
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # The classifier fails closed: workflow_dispatch, an empty/zero/unknown
          # range, or any path it cannot place selects every lane.
          python3 tools/classify_ci_scope.py \
            --event "${{ github.event_name }}" \
            --base "$base" \
            --head "$head"

      - name: Restore the broad default when classification did not complete
        if: steps.classify.outcome != 'success'
        run: |
          {
            echo "lanes=docs,server,runner_scientific,browser,compose"
            echo "server=true"
            echo "runner_scientific=true"
            echo "browser=true"
            echo "compose=true"
          } >> "$GITHUB_OUTPUT"

  REvoComputeTests:
    needs: ClassifyChanges
    if: ${{ !cancelled() && needs.ClassifyChanges.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OS: ubuntu-latest
      PYTHON: "3.12"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa # 0.12.1

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Server and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Enforce the MCP adapter boundary
        run: python tools/check_mcp_boundary.py

      - name: Run Python Server and Contract Tests with Coverage
        run: make test-cov COV_REPORT=xml:coverage.xml PYTEST="python -m pytest -n 4 --dist=load"

      # Bounded registry/discovery determinism gate: re-runs the discovery,
      # workflow-composer, and AF3 runner files under several xdist
      # distributions plus the AF3 file alone, so residual test-scheduling-order
      # dependence surfaces here rather than intermittently in the coverage run.
      # Reuses the canonical Makefile target (no duplicated pytest invocation);
      # the step timeout keeps the added cost bounded.
      - name: Registry determinism gate
        timeout-minutes: 10
        run: make test-registry-xdist

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: server

  RunnerScientificAcceptance:
    needs: ClassifyChanges
    if: ${{ !cancelled() && needs.ClassifyChanges.outputs.runner_scientific != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      JAX_PLATFORM_NAME: cpu
      MPLCONFIGDIR: /tmp/matplotlib

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the Runner's Pinned Scientific Stack
        run: pip install -r docker/runners/gremlin_lh/requirements.lock pytest

      - name: Run GREMLIN_LH Upstream Equivalence Acceptance
        run: python -m pytest tests/runners/gremlin_lh/test_upstream_equivalence.py -q -p no:cacheprovider --noconftest

  BrowserContracts:
    needs: ClassifyChanges
    if: ${{ !cancelled() && needs.ClassifyChanges.outputs.browser != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm run verify:lock
          npm ci

      - name: Typecheck Frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Install Server and Test Dependencies
        run: pip install -e ".[test]"

      - name: Install Chromium for Browser Contracts
        run: python -m playwright install --with-deps chromium

      - name: Run Browser Acceptance Contracts
        run: python -m pytest tests -m "browser and not molstar_csp" -n 4 --dist=load -v --tracing=retain-on-failure --durations=20

      - name: Qualify Mol* Under Strict CSP
        run: xvfb-run -a --server-args="-screen 0 1400x1000x24" python -m pytest tests/test_playwright_molstar_csp.py --headed -v --tracing=retain-on-failure

      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  ServerComposeFullStack:
    needs: ClassifyChanges
    if: ${{ !cancelled() && needs.ClassifyChanges.outputs.compose != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Server and Test Dependencies
        run: pip install -e ".[test]"

      - name: Exercise controller contracts with mocked OS/HPC boundaries
        run: python -m pytest -q tests/test_slurm_runner.py tests/test_full_stack_smoke.py

      - name: Run server Compose full-stack gate
        run: make test-docker-full-stack
