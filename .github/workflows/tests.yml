name: REvoCompute Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lightweight change-set classifier: documentation-only changes skip the
  # expensive matrix below. The workflow itself stays triggered on its normal
  # events so the other jobs are still created (skipped, not absent), which keeps
  # branch-protection expected-check semantics intact.
  ClassifyChanges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_tests: ${{ steps.classify.outputs.run_tests }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify Change Set
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # push (and any other ref-based event): diff against the previous tip.
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # The classifier fails safe: workflow_dispatch, an empty/zero/unknown
          # range, or any non-documentation path keeps run_tests=true.
          python3 tools/classify_ci_scope.py \
            --event "${{ github.event_name }}" \
            --base "$base" \
            --head "$head"

  REvoComputeTests:
    needs: ClassifyChanges
    if: needs.ClassifyChanges.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OS: ubuntu-latest
      PYTHON: "3.12"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa # 0.12.1

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Server and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Python Server and Contract Tests with Coverage
        run: make test-cov COV_REPORT=xml:coverage.xml PYTEST="python -m pytest -n 4 --dist=load"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: server

  RunnerScientificAcceptance:
    needs: ClassifyChanges
    if: needs.ClassifyChanges.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      JAX_PLATFORM_NAME: cpu
      MPLCONFIGDIR: /tmp/matplotlib

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the Runner's Pinned Scientific Stack
        run: pip install -r docker/runners/gremlin_lh/requirements.lock pytest

      - name: Run GREMLIN_LH Upstream Equivalence Acceptance
        run: python -m pytest tests/runners/gremlin_lh/test_upstream_equivalence.py -q -p no:cacheprovider --noconftest

  BrowserContracts:
    needs: ClassifyChanges
    if: needs.ClassifyChanges.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm run verify:lock
          npm ci

      - name: Typecheck Frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Install Server and Test Dependencies
        run: pip install -e ".[test]"

      - name: Install Chromium for Browser Contracts
        run: python -m playwright install --with-deps chromium

      - name: Run Browser Acceptance Contracts
        run: python -m pytest tests -m "browser and not molstar_csp" -n 4 --dist=load -v --tracing=retain-on-failure --durations=20

      - name: Qualify Mol* Under Strict CSP
        run: xvfb-run -a --server-args="-screen 0 1400x1000x24" python -m pytest tests/test_playwright_molstar_csp.py --headed -v --tracing=retain-on-failure

      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  ServerComposeFullStack:
    needs: ClassifyChanges
    if: needs.ClassifyChanges.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Server and Test Dependencies
        run: pip install -e ".[test]"

      - name: Exercise controller contracts with mocked OS/HPC boundaries
        run: python -m pytest -q tests/test_slurm_runner.py tests/test_full_stack_smoke.py

      - name: Run server Compose full-stack gate
        run: make test-docker-full-stack
