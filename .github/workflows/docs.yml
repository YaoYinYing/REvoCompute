name: REvoCompute Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      # Root-level markdown is checked for duplicate guides, and README.md links
      # into docs/, so a rename there must re-run this workflow.
      - "*.md"
      - "revocompute/static/openapi.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
      - "revocompute/static/openapi.json"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository layout
        run: |
          # docs/ is the single source of truth. Root-level markdown is limited to
          # the agent contract, compatibility symlinks into docs/, and the
          # maintainer backlog. Keep this in sync with
          # docs/developer-guide/documentation.md.
          status=0

          # Compatibility symlinks must stay symlinks AND keep pointing at the
          # canonical docs/ page. Replacing one with a regular file silently
          # re-forks content, which is the exact drift this workflow prevents;
          # the check must not trust the filename alone.
          declare -A symlinks=(
            ["AGENTS.md"]="CLAUDE.md"
            ["SECURITY.md"]="docs/reference/security.md"
            ["CODE_OF_CONDUCT.md"]="docs/reference/code-of-conduct.md"
            ["LONG_TASK_HANDLING.md"]="docs/agents/long-task-handling.md"
          )
          for path in "${!symlinks[@]}"; do
            want="${symlinks[$path]}"
            if [ ! -L "$path" ]; then
              echo "::error file=$path::$path must be a symlink to '$want'; a regular file re-forks canonical content."
              status=1
              continue
            fi
            got="$(readlink "$path")"
            if [ "$got" != "$want" ]; then
              echo "::error file=$path::$path points at '$got'; the canonical target is '$want'."
              status=1
              continue
            fi
            if [ ! -e "$path" ]; then
              echo "::error file=$path::$path is a dangling symlink; target '$want' does not exist."
              status=1
            fi
          done

          # Regular root-level markdown is limited to the agent contract and the
          # frozen working notes. TODO.md and TODO_*.md are the maintainer backlog.
          allowed="README.md CLAUDE.md IMPLEMENTATION_STATE.md GOAL_GMX_MMPBSA.md"
          for path in *.md; do
            name="$(basename "$path")"
            case "$name" in
              TODO.md|TODO_*.md) continue ;;
            esac
            case " ${!symlinks[*]} " in
              *" $name "*) continue ;;
            esac
            case " $allowed " in
              *" $name "*) continue ;;
            esac
            echo "::error file=$path::Root-level guide '$name' duplicates the published docs tree. Move it under docs/ and delete it, or add it to .github/workflows/docs.yml and docs/developer-guide/documentation.md."
            status=1
          done
          exit "$status"
      - run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9,<10"
      - run: mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
