<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">REvoCompute server architecture</title>
  <desc id="description">The public edge routes requests to containerized server services. A worker submits validated jobs through Slurm to isolated Apptainer runtimes. Persistent state and evidence-gated deployment are separate layers.</desc>
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#147784"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#697882"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#ad681c"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 0; fill: #17242c; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #53626c; }
      .boundary { fill: #ffffff; stroke: #bac6cc; stroke-width: 1.5; }
      .boundary-title { font-size: 14px; font-weight: 700; fill: #42515a; }
      .edge { fill: #edf8f8; stroke: #438892; stroke-width: 1.5; }
      .service { fill: #f4f7f8; stroke: #71838d; stroke-width: 1.5; }
      .compute { fill: #f1f4fa; stroke: #687b9d; stroke-width: 1.5; }
      .state { fill: #fffdf7; stroke: #9b895b; stroke-width: 1.5; }
      .control { fill: #fff7eb; stroke: #b77a34; stroke-width: 1.5; }
      .box-title { font-size: 17px; font-weight: 700; }
      .copy { font-size: 13px; fill: #52616b; }
      .small { font-size: 12px; fill: #5b6972; }
      .chip { font-size: 11px; font-weight: 700; fill: #40515a; }
      .inline-copy { font-size: 12px; fill: #52616b; }
      .flow-label { font-size: 11px; font-weight: 700; fill: #147784; }
      .strip-title { font-size: 15px; font-weight: 700; }
      .section-title { font-size: 12px; font-weight: 700; fill: #40515a; }
      .divider { stroke: #c8d0dc; stroke-width: 1; }
      .main-line { fill: none; stroke: #147784; stroke-width: 3; marker-end: url(#arrow-main); }
      .data-line { fill: none; stroke: #697882; stroke-width: 1.8; marker-end: url(#arrow-data); }
      .data-both { fill: none; stroke: #697882; stroke-width: 1.8; marker-start: url(#arrow-data); marker-end: url(#arrow-data); }
      .control-line { fill: none; stroke: #ad681c; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-control); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f8f9"/>
  <text x="40" y="50" class="title">REvoCompute Server Architecture</text>
  <text x="40" y="76" class="subtitle">Server-owned policy validates each request before an isolated runtime receives a task-private workspace.</text>

  <!-- Ingress -->
  <rect x="40" y="110" width="260" height="410" rx="8" class="boundary"/>
  <text x="58" y="138" class="boundary-title">Public edge</text>
  <rect x="70" y="172" width="200" height="70" rx="6" class="edge"/>
  <text x="170" y="201" text-anchor="middle" class="box-title">Client</text>
  <text x="170" y="224" text-anchor="middle" class="copy">Browser or API consumer</text>
  <rect x="70" y="278" width="200" height="78" rx="6" class="edge"/>
  <text x="170" y="307" text-anchor="middle" class="box-title">TLS / reverse proxy</text>
  <text x="170" y="331" text-anchor="middle" class="copy">External trust boundary</text>
  <rect x="70" y="392" width="200" height="92" rx="6" class="edge"/>
  <text x="170" y="421" text-anchor="middle" class="box-title">Gateway</text>
  <text x="170" y="445" text-anchor="middle" class="copy">Nginx request proxy</text>
  <text x="170" y="466" text-anchor="middle" class="copy">Authorized artifact delivery</text>
  <path d="M170 242V278" class="main-line"/>
  <path d="M170 356V392" class="main-line"/>

  <!-- Server services -->
  <rect x="330" y="110" width="650" height="410" rx="8" class="boundary"/>
  <text x="348" y="138" class="boundary-title">Docker Compose · server control plane</text>
  <rect x="365" y="172" width="310" height="128" rx="6" class="service"/>
  <text x="387" y="202" class="box-title">Web / API</text>
  <text x="387" y="227" class="copy">Authentication and authorization</text>
  <text x="387" y="248" class="copy">Schema validation and execution plans</text>
  <text x="387" y="269" class="copy">Access + readiness admission</text>
  <rect x="715" y="172" width="230" height="128" rx="6" class="service"/>
  <text x="737" y="202" class="box-title">Redis</text>
  <text x="737" y="227" class="copy">Broker and result backend</text>
  <text x="737" y="248" class="copy">Authenticated, internal only</text>
  <text x="737" y="273" class="chip">TRANSPORT ONLY</text>
  <rect x="715" y="344" width="230" height="140" rx="6" class="service"/>
  <text x="737" y="374" class="box-title">Celery worker</text>
  <text x="737" y="399" class="copy">Submit, poll, and cancel</text>
  <text x="737" y="420" class="copy">Capture logs and stages</text>
  <text x="737" y="441" class="copy">Validate result contracts</text>
  <text x="737" y="462" class="copy">Finalize artifact manifests</text>
  <rect x="365" y="344" width="310" height="88" rx="6" class="service"/>
  <text x="387" y="372" class="box-title">Contract registry</text>
  <text x="387" y="396" class="copy">Server core: policy, discovery, acceptance</text>
  <text x="387" y="417" class="copy">Family manifests, schemas, entrypoints</text>
  <rect x="365" y="442" width="310" height="42" rx="6" class="service"/>
  <text x="387" y="459" class="strip-title">Maintenance</text>
  <text x="387" y="477" class="small">Backups · retention · digests · log rotation</text>
  <path d="M270 438H320V236H365" class="main-line"/>
  <path d="M675 236H715" class="main-line"/>
  <path d="M830 300V344" class="main-line"/>
  <path d="M675 388H695V414H715" class="data-line"/>

  <!-- Scheduled execution -->
  <rect x="1010" y="110" width="550" height="410" rx="8" class="boundary"/>
  <text x="1028" y="138" class="boundary-title">Slurm execution plane</text>
  <rect x="1035" y="172" width="210" height="312" rx="6" class="compute"/>
  <text x="1057" y="202" class="box-title">Scheduler</text>
  <text x="1057" y="229" class="section-title">Resolved request</text>
  <text x="1057" y="250" class="copy">Partition and time limit</text>
  <text x="1057" y="270" class="copy">CPU and memory</text>
  <line x1="1057" y1="286" x2="1223" y2="286" class="divider"/>
  <text x="1057" y="311" class="section-title">Scheduling</text>
  <text x="1057" y="333" class="copy">Queue and priority policy</text>
  <text x="1057" y="354" class="copy">Current cluster capacity</text>
  <text x="1057" y="375" class="copy">Compute-node allocation</text>
  <line x1="1057" y1="394" x2="1223" y2="394" class="divider"/>
  <text x="1057" y="418" class="section-title">Job state</text>
  <text x="1057" y="439" class="copy">Pending → running</text>
  <text x="1057" y="460" class="copy">Terminal state + exit code</text>
  <text x="1057" y="477" class="small">Authenticated client boundary</text>
  <rect x="1275" y="150" width="250" height="334" rx="6" class="compute"/>
  <text x="1297" y="181" class="box-title">Compute node</text>
  <rect x="1297" y="207" width="206" height="108" rx="5" fill="#ffffff" stroke="#7787a4" stroke-width="1.5"/>
  <text x="1400" y="238" text-anchor="middle" class="box-title">Apptainer runtime</text>
  <text x="1400" y="263" text-anchor="middle" class="copy">Ephemeral, isolated</text>
  <text x="1400" y="284" text-anchor="middle" class="copy">Pinned family entrypoint</text>
  <rect x="1297" y="344" width="206" height="108" rx="5" fill="#ffffff" stroke="#7787a4" stroke-width="1.5"/>
  <text x="1400" y="375" text-anchor="middle" class="box-title">Private workspace</text>
  <text x="1400" y="400" text-anchor="middle" class="copy">Immutable input snapshot</text>
  <text x="1400" y="421" text-anchor="middle" class="copy">Writable output directory</text>
  <path d="M945 385H986V236H1035" class="main-line"/>
  <path d="M1245 236H1275" class="main-line"/>
  <path d="M1400 315V344" class="data-both"/>
  <path d="M1297 292H1253V500H1002V450H945" class="main-line"/>
  <text x="1120" y="495" text-anchor="middle" class="flow-label">status · logs · declared outputs</text>

  <!-- Persistent state -->
  <rect x="40" y="550" width="1520" height="166" rx="8" class="boundary"/>
  <text x="58" y="578" class="boundary-title">Persistent host state</text>
  <rect x="70" y="603" width="260" height="82" rx="6" class="state"/>
  <text x="200" y="634" text-anchor="middle" class="box-title">Identity</text>
  <text x="200" y="658" text-anchor="middle" class="copy">Web and maintenance only</text>
  <rect x="360" y="603" width="300" height="82" rx="6" class="state"/>
  <text x="510" y="634" text-anchor="middle" class="box-title">Task state and workspaces</text>
  <text x="510" y="658" text-anchor="middle" class="copy">User-owned inputs, outputs, metadata</text>
  <rect x="690" y="603" width="270" height="82" rx="6" class="state"/>
  <text x="825" y="634" text-anchor="middle" class="box-title">Results and logs</text>
  <text x="825" y="658" text-anchor="middle" class="copy">Manifests, artifacts, service records</text>
  <rect x="990" y="603" width="540" height="82" rx="6" class="state"/>
  <text x="1260" y="634" text-anchor="middle" class="box-title">Runtime supply</text>
  <text x="1260" y="658" text-anchor="middle" class="copy">Active SIF images, provenance, receipts, read-only models and databases</text>
  <path d="M520 344V300" class="data-line"/>
  <path d="M620 300V326H340V535H200V603" class="data-both"/>
  <path d="M785 484V535H510V603" class="data-both"/>
  <path d="M860 484V603" class="data-both"/>
  <path d="M1503 261H1542V535H1260V603" class="data-line"/>

  <!-- Evidence-gated operations -->
  <rect x="40" y="746" width="1520" height="112" rx="8" class="boundary"/>
  <text x="58" y="774" class="boundary-title">Evidence-gated operations</text>
  <rect x="70" y="796" width="160" height="40" rx="6" class="control"/>
  <text x="150" y="821" text-anchor="middle" class="box-title">Operator</text>
  <rect x="290" y="796" width="230" height="40" rx="6" class="control"/>
  <text x="405" y="821" text-anchor="middle" class="box-title">Deployment controller</text>
  <rect x="580" y="796" width="260" height="40" rx="6" class="control"/>
  <text x="710" y="821" text-anchor="middle" class="box-title">Build + real-path live test</text>
  <rect x="900" y="796" width="280" height="40" rx="6" class="control"/>
  <text x="1040" y="821" text-anchor="middle" class="box-title">Hash + provenance + receipt</text>
  <rect x="1240" y="796" width="290" height="40" rx="6" class="control"/>
  <text x="1385" y="821" text-anchor="middle" class="box-title">Evidence-gated promotion</text>
  <path d="M230 816H290" class="control-line"/>
  <path d="M520 816H580" class="control-line"/>
  <path d="M840 816H900" class="control-line"/>
  <path d="M1180 816H1240" class="control-line"/>
  <path d="M1385 796V685" class="control-line"/>

  <!-- Legend -->
  <line x1="40" y1="882" x2="92" y2="882" class="main-line"/>
  <text x="105" y="887" class="small">request and execution</text>
  <line x1="300" y1="882" x2="352" y2="882" class="data-line"/>
  <text x="365" y="887" class="small">persistent data access</text>
  <line x1="560" y1="882" x2="612" y2="882" class="control-line"/>
  <text x="625" y="887" class="small">build, validation, and promotion</text>
  <text x="1530" y="887" text-anchor="end" class="small">Admission = access entitlement + current readiness · Scheduling = available capacity</text>
</svg>
