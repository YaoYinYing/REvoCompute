# version: "3.9"

x-task-env: &task-env
  SERVER_IMAGE: ${SERVER_IMAGE:-revodesign-revocompute-server}

  SERVER_DIR: ${SERVER_DIR}
  MANAGE_DB_PATH: ${MANAGE_DB_PATH:-}
  ENABLED_TASKRUNNERS: ${ENABLED_TASKRUNNERS:-}
  SLURM_ALLOWED_QUEUES: ${SLURM_ALLOWED_QUEUES:-}
  REVOCOMPUTE_SCRATCH_BACKEND: ${REVOCOMPUTE_SCRATCH_BACKEND:-disk}
  RUNNER_HOST_ROOT: ${RUNNER_HOST_ROOT:-}
  REVOCOMPUTE_IMAGE_DIR: ${REVOCOMPUTE_IMAGE_DIR:-}
  LOG_DIR: ${LOG_DIR}
  DB_PATH: ${DB_PATH:-}
  # RUNNERS_DIR is the sole source of the materialized Runner family tree
  # (task manifests, runner manifests, storyboards, Runner-local scripts).
  # CONFIG_DIR is host-side deployment configuration only and is not consumed
  # inside any service container; see docker-compose.slurm.yml.
  RUNNERS_DIR: ${SERVER_DIR}/docker/runners
  TOOLS_DIR: ${SERVER_DIR}/docker/tools
  TOOL_IMAGE_DIR: ${TOOL_IMAGE_DIR:-${SERVER_DIR}/../images/tools}
  ENABLED_TOOL_FAMILIES: ${ENABLED_TOOL_FAMILIES:-}
  TOOL_MAX_ACTIVE_PER_USER: ${TOOL_MAX_ACTIVE_PER_USER:-3}
  TOOL_MAX_ACTIVE_GLOBAL: ${TOOL_MAX_ACTIVE_GLOBAL:-8}
  TOOL_WORKER_CONCURRENCY: ${TOOL_WORKER_CONCURRENCY:-2}
  TOOL_CALL_TIMEOUT_SECONDS: ${TOOL_CALL_TIMEOUT_SECONDS:-300}
  TOOL_CALL_TTL_SECONDS: ${TOOL_CALL_TTL_SECONDS:-86400}
  TOOL_RUNTIME_IDLE_TTL_SECONDS: ${TOOL_RUNTIME_IDLE_TTL_SECONDS:-1800}
  TOOL_STORAGE_MAX_BYTES: ${TOOL_STORAGE_MAX_BYTES:-104857600}
  TOOL_REQUEST_MAX_BYTES: ${TOOL_REQUEST_MAX_BYTES:-16777216}
  TOOL_OUTPUT_MAX_BYTES: ${TOOL_OUTPUT_MAX_BYTES:-33554432}

  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
  BROKER_URL: ${BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
  RESULT_BACKEND: ${RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis:6379/0}

  MAXMEM: ${MAXMEM:-64}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

  # The web service evaluates admission from worker-published evidence; the
  # worker owns the pulse that refreshes it. Both need the same intervals.
  INFRA_REFRESH_SECONDS: ${INFRA_REFRESH_SECONDS:-15}
  INFRA_STALE_SECONDS: ${INFRA_STALE_SECONDS:-60}
  INFRA_DISK_WARNING_PERCENT_FREE: ${INFRA_DISK_WARNING_PERCENT_FREE:-10}
  INFRA_DISK_CRITICAL_PERCENT_FREE: ${INFRA_DISK_CRITICAL_PERCENT_FREE:-5}

  RUNNER_UID: ${RUNNER_UID:-1000}
  RUNNER_GID: ${RUNNER_GID:-1000}
  RUNNER_USERNAME: ${RUNNER_USERNAME:-revodesign}
  RUNNER_GROUP: ${RUNNER_GROUP:-revodesign}

  TZ: ${TZ:-Europe/London}

x-web-auth-env: &web-auth-env
  PORT: ${PORT:-8080}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  RESULT_DOWNLOAD_MODE: ${RESULT_DOWNLOAD_MODE:-nginx}
  ADMIN_USERS: ${ADMIN_USERS}
  AUTH_TOKEN_MAX_AGE: ${AUTH_TOKEN_MAX_AGE:-604800}
  USER_DB_PATH: ${USER_DB_PATH:-/var/lib/revodesign-auth/users.sqlite3}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
  ENABLE_REGISTER: ${ENABLE_REGISTER:-false}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}

  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  SMTP_FROM_ADDR: ${SMTP_FROM_ADDR:-hello@revodesign.local}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-REvoDesign GREMLIN Server}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_ADDR: ${RESEND_FROM_ADDR:-onboarding@resend.dev}
  RESEND_FROM_NAME: ${RESEND_FROM_NAME:-REvoDesign GREMLIN Server}
  SERVER_BASE_URL: ${SERVER_BASE_URL:-http://localhost:8080}
  ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
  CLIENT_IP_HEADERS: ${CLIENT_IP_HEADERS:-X-Forwarded-For,X-Real-IP}
  CLIENT_COUNTRY_HEADER: ${CLIENT_COUNTRY_HEADER:-}

x-maintenance-env: &maintenance-env
  ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
  ADMIN_NEW_USER_INFORM: ${ADMIN_NEW_USER_INFORM:-0}
  RESULT_RETENTION_DAYS: ${RESULT_RETENTION_DAYS:-}
  BACKUP_DB_CRON: ${BACKUP_DB_CRON:-}
  BACKUP_DB_PATH: ${BACKUP_DB_PATH:-}
  MAX_DB_BACKUP: ${MAX_DB_BACKUP:-}
  ROTATE_LOG_MAX_LINENO: ${ROTATE_LOG_MAX_LINENO:-}
  ROTATE_LOG_PERIOD: ${ROTATE_LOG_PERIOD:-}
  MAX_LOG_SIZE: ${MAX_LOG_SIZE:-}

services:
  redis:
    image: redis:7.2-alpine
    user: ${RUNNER_UID}:${RUNNER_GID}
    restart: unless-stopped
    # --requirepass is mandatory: restart.sh generates and persists
    # REDIS_PASSWORD in the deployment env file, and the Celery URIs embed it.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?required; restart.sh setup generates the broker secret}"]
    volumes:
      - redis-data:/data

  gateway:
    image: nginx:1.28-alpine
    # The gateway's own stdout access log is outside LOG_DIR and log_rotation,
    # so bound it here instead of letting it grow with every request.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    user: ${RUNNER_UID}:${RUNNER_GID}
    read_only: true
    depends_on:
      - web
    environment:
      UPSTREAM_PORT: ${PORT:-8080}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        envsubst '$$UPSTREAM_PORT' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf
        && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    # Loopback-only by default: the documented entry point is a host-side
    # proxy (nginx TLS / Cloudflare Tunnel) reaching the gateway via
    # localhost.  Deployments whose proxy terminates elsewhere can set
    # GATEWAY_BIND=0.0.0.0 in the env file — that publishes on all host
    # interfaces, so keep the outer auth/TLS layer in front of it.
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ${SERVER_DIR}:/srv/deployment:ro
      - ${SERVER_DIR}/results:/srv/results:ro
    tmpfs:
      - /tmp:size=16m,mode=1777

  web:
    image: ${SERVER_IMAGE:-revodesign-revocompute-server:latest}
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      args:
        RUNNER_UID: ${RUNNER_UID}
        RUNNER_GID: ${RUNNER_GID}
        RUNNER_USERNAME: ${RUNNER_USERNAME}
        RUNNER_GROUP: ${RUNNER_GROUP}
        PORT: ${PORT:-8080}
    environment:
      <<: [*task-env, *web-auth-env]
      ADMIN_BOOTSTRAP_CREDENTIALS: ${ADMIN_BOOTSTRAP_CREDENTIALS:-}
    # gunicorn's error/access logs (and any stdout) are capped here as well as
    # rotated inside LOG_DIR.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    user: ${RUNNER_UID}:${RUNNER_GID}
    depends_on:
      - redis
    # Trust X-Forwarded-Proto only from the gateway container.  The web
    # service publishes no ports, so nothing outside the compose bridge
    # (default docker range 172.16.0.0/12) can reach gunicorn directly.
    command: >-
      gunicorn -w ${GUNICORN_WORKERS:-2}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --preload
      --no-control-socket
      --forwarded-allow-ips 127.0.0.1,172.16.0.0/12
      -b 0.0.0.0:${PORT:-8080}
      --access-logfile ${LOG_DIR}/gunicorn-access.log
      --error-logfile ${LOG_DIR}/gunicorn-error.log
      --access-logformat '%({CF-Connecting-IP}i)s (%({Cf-Ipcountry}i)s) - %(u)s %(t)s "%(m)s %(U)s" %(s)s %(B)s "%(a)s"'
      revocompute.app:app
    working_dir: /app/server
    expose:
      - "${PORT:-8080}"
    volumes:
      - ${SERVER_DIR}:${SERVER_DIR}
      - ${SERVER_DIR}/docker/runners:${SERVER_DIR}/docker/runners:ro
      - ${SERVER_DIR}/../images:${SERVER_DIR}/../images:ro
      - ${AUTH_DIR:-./auth-data}:/var/lib/revodesign-auth
      - ${LOG_DIR}:${LOG_DIR}

  maintenance:
    image: ${SERVER_IMAGE:-revodesign-revocompute-server}
    environment:
      <<: [*task-env, *web-auth-env, *maintenance-env]
    restart: unless-stopped
    user: ${RUNNER_UID}:${RUNNER_GID}
    command: python -m revocompute.maintenance.manager
    working_dir: /app/server
    volumes:
      - ${SERVER_DIR}:${SERVER_DIR}
      - ${SERVER_DIR}/docker/runners:${SERVER_DIR}/docker/runners:ro
      - ${SERVER_DIR}/../images:${SERVER_DIR}/../images:ro
      - ${AUTH_DIR:-./auth-data}:/var/lib/revodesign-auth
      - ${LOG_DIR}:${LOG_DIR}

  worker:
    image: ${SERVER_IMAGE:-revodesign-revocompute-server}
    restart: unless-stopped
    user: ${RUNNER_UID}:${RUNNER_GID}
    # The base worker has no container-engine socket. The Slurm override adds
    # only scheduler and Apptainer client boundaries.
    environment:
      <<: *task-env
    depends_on:
      - redis
    command: >-
      celery -A revocompute.task_runtime.celery worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-2}
      --logfile ${LOG_DIR}/celery-worker.log
    working_dir: /app/server
    volumes:
      - ${SERVER_DIR}:${SERVER_DIR}
      - ${SERVER_DIR}/docker/runners:${SERVER_DIR}/docker/runners:ro
      - ${SERVER_DIR}/../images:${SERVER_DIR}/../images:ro
      - ${LOG_DIR}:${LOG_DIR}

  tool-worker:
    image: ${SERVER_IMAGE:-revodesign-revocompute-server}
    restart: unless-stopped
    user: ${RUNNER_UID}:${RUNNER_GID}
    environment:
      <<: *task-env
    depends_on:
      - redis
    command: >-
      celery -A revocompute.tool_runtime.celery worker
      --queues=tools
      --loglevel=info
      --concurrency=${TOOL_WORKER_CONCURRENCY:-2}
      --logfile ${LOG_DIR}/tool-worker.log
    working_dir: /app/server
    volumes:
      - ${SERVER_DIR}:${SERVER_DIR}
      - ${SERVER_DIR}/docker/tools:${SERVER_DIR}/docker/tools:ro
      - ${TOOL_IMAGE_DIR:-${SERVER_DIR}/../images/tools}:${TOOL_IMAGE_DIR:-${SERVER_DIR}/../images/tools}:ro
      - ${LOG_DIR}:${LOG_DIR}

volumes:
  redis-data:
