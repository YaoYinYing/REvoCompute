api_version: 1
id: p2rank
version: '1'
name: P2Rank pocket prediction
runtime:
  image_artifact: p2rank_v1.sif
  definition: p2rank.def
  build_inputs:
  - p2rank/run.sh
  - p2rank/predict.py
  - p2rank/normalize_results.py
  - p2rank/model-assets.sha256
  - p2rank/upstream.json
  - common/task_context.sh
  - common/task_context.py
  - common/verify_model_asset.sh
  entrypoint: [bash, /app/revocompute/run.sh]
tasks: [tasks/p2rank/task.yaml]
