api_version: 1
id: boltz
version: '1'
runtime:
  image_artifact: boltz_v1.sif
  definition: boltz.def
  build_inputs:
  - boltz/run.sh
  - boltz/prepare_input.py
  - boltz/requirements.in
  - boltz/requirements.lock
  - boltz/model-assets.sha256
  - boltz/upstream.json
  # Family adapter code is still baked here; migration is deferred (IMPLEMENTATION_STATE.md).
  runtime_overlay:
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/boltz_predict/task.yaml
