api_version: 1
id: alphafold3
version: '1'
runtime:
  image_artifact: alphafold3_v1.sif
  definition: alphafold3.def
  build_inputs:
  - alphafold3/run.sh
  - common/task_context.sh
  - common/task_context.py
  access_policy: alphafold3_noncommercial
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/predict/task.yaml
access_policies:
- policies/noncommercial.yaml
contributions:
  access_policies:
  - alphafold3_noncommercial
  input_workspace_plugins:
  - id: jaag-builder
    module: workspace/jaag-builder/index.js
    styles:
    - workspace/jaag-builder/style.css
    configuration_schema: workspace/jaag-builder/schema.json
