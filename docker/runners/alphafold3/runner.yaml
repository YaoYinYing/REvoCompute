# AlphaFold 3 runtime settings. Restricted weights and reference databases
# remain operator-managed and are exposed only to scheduled runner processes.
mounts:
  - host_path: "/mnt/db/weights/alphafold3"
    container_path: "/mnt/alphafold3/models"
    mode: "ro"
  - host_path: "/mnt/db/alphafold3"
    container_path: "/mnt/alphafold3/databases"
    mode: "ro"
  - host_path: "/mnt/db/reduced_bfd"
    container_path: "/mnt/alphafold3/reduced_bfd"
    mode: "ro"
env: {}
max_runtime_seconds: 86400
defaults: {}
