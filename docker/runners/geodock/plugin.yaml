api_version: 1
id: geodock
version: '1'
runtime:
  image_artifact: geodock_v1.sif
  definition: geodock.def
  build_inputs:
  - geodock/run.sh
  - geodock/launch.py
  - geodock/predict.py
  - geodock/requirements.in
  - geodock/requirements.lock
  - geodock/model-assets.sha256
  - geodock/upstream.json
  - common/task_context.sh
  - common/task_context.py
  access_policy: geodock_academic_only
  entrypoint: [bash, /app/revocompute/run.sh]
tasks:
- tasks/geodock/task.yaml
access_policies:
- common/policy/geodock_academic_only.yaml
contributions:
  access_policies:
  - geodock_academic_only
