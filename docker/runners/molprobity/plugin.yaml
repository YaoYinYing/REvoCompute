api_version: 1
id: molprobity
version: '1'
name: MolProbity structure validation
runtime:
  image_artifact: molprobity_v1.sif
  definition: molprobity.def
  build_inputs:
  - molprobity/run.sh
  - molprobity/validate.py
  - molprobity/model-assets.sha256
  - molprobity/upstream.json
  # Family adapter code is still baked here; migration is deferred (IMPLEMENTATION_STATE.md).
  runtime_overlay:
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  entrypoint: [bash, /app/revocompute/run.sh]
tasks: [tasks/molprobity_validate/task.yaml]
