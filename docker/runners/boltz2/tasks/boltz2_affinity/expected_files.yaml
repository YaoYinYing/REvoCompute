result:
  files:
    structures:
      pattern: 'boltz_results_*/predictions/*/*_model_*.cif'
      cardinality: many
      required: true
      type: structure
    confidence:
      pattern: 'boltz_results_*/predictions/*/confidence_*_model_*.json'
      cardinality: many
      required: true
      type: json
    affinity:
      pattern: 'boltz_results_*/predictions/*/affinity_*.json'
      cardinality: one
      required: true
      type: json
    upstream_identity:
      path: boltz2-upstream.json
      cardinality: one
      required: true
      type: json
    model_assets:
      path: boltz2-model-assets.sha256
      cardinality: one
      required: true
      type: text
    input_provenance:
      path: boltz2-input-provenance.json
      cardinality: one
      required: true
      type: json
