api_version: 1
id: pallatom
version: '1'
runtime:
  image_artifact: pallatom_v1.sif
  definition: pallatom.def
  build_inputs:
  - pallatom/run.sh
  - pallatom/generate.py
  - pallatom/requirements.txt
  - pallatom/requirements.lock
  - common/task_context.sh
  - common/task_context.py
  access_policy: pallatom_noncommercial
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/pallatom_generate/task.yaml
access_policies:
- policies/noncommercial.yaml
contributions:
  access_policies:
  - pallatom_noncommercial
