api_version: 1
id: deeppocket
version: '1'
name: DeepPocket pocket detection and segmentation
runtime:
  image_artifact: deeppocket_v1.sif
  definition: deeppocket.def
  build_inputs:
  - deeppocket/run.sh
  - deeppocket/predict.py
  - deeppocket/normalize_results.py
  - deeppocket/model-assets.sha256
  - deeppocket/upstream.json
  # Family adapter code is still baked here; migration is deferred (IMPLEMENTATION_STATE.md).
  runtime_overlay:
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  - common/runtime/verify_model_asset.sh
  entrypoint: [bash, /app/revocompute/run.sh]
tasks: [tasks/deeppocket/task.yaml]
