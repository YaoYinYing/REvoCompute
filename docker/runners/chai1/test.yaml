version: 1
collections:
  smoke:
    description: Minimal offline Chai-1 single-sequence structure prediction.
    cases:
    - id: chai1-minimal-offline
      task: chai1_predict
      input:
        files:
        - tests/data/chai1/minimal.fasta
      parameters:
        use_esm_embeddings: true
        use_msa: false
        use_restraints: false
        recycle_msa_subsample: 0
        num_trunk_recycles: 1
        num_diffusion_timesteps: 2
        num_diffusion_samples: 1
        num_trunk_samples: 1
        seed: 0
        low_memory: true
      assertions:
        success: true
        required_artifacts:
        - ranked/rank_*.cif
        - confidence.rank_*.json
        - pae.rank_*.npy
        - pde.rank_*.npy
        - plddt.rank_*.npy
        - ranking.json
        - run_metadata.json
        - chai1-model-assets.json
