version: 1
collections:
  smoke:
    cases:
    - id: minimal-foundry-rfd3
      task: foundry_rfd3_design
      input: {roles: {specification: [tests/data/foundry/rfd3_unconditional.json]}}
      parameters: {num_designs: 1, diffusion_steps: 2, num_recycles: 1, seed: 0, low_memory_mode: true, dump_trajectories: false, inference_mode: legacy, sampler_step_scale: 1.5, sampler_gamma_0: 0.6, classifier_free_guidance: false, centering: all}
    - id: minimal-foundry-rfd3na
      task: foundry_rfd3na_design
      input: {roles: {specification: [tests/data/foundry/rfd3na_unconditional.json]}}
      parameters: {num_designs: 1, diffusion_steps: 2, seed: 0, low_memory_mode: true, dump_trajectories: false, sampler_step_scale: 1.5, sampler_gamma_0: 0.6, classifier_free_guidance: false, centering: all}
    - id: minimal-foundry-rf3
      task: foundry_rf3_fold
      input: {roles: {specification: [tests/data/foundry/rf3_monomer.json]}}
      parameters: {num_designs: 1, diffusion_steps: 2, num_recycles: 1, seed: 0, early_stopping_plddt_threshold: 0.0, dump_trajectories: false, template_noise_scale: 0.00001, add_missing_atoms: true, annotate_b_factor_with_plddt: true}
