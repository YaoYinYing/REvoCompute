      sha256: 2d4d8685aa92176837eb53456e6375b3d1c41793bb57a4fcf96d165db2192cb2
      media_type: application/json
  parameters:
    num_designs: 1
    diffusion_steps: 50
    seed: 0
    low_memory_mode: false
    dump_trajectories: false
    sampler_step_scale: 1.5
    sampler_gamma_0: 0.6
    classifier_free_guidance: false
    centering: all
