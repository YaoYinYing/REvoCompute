demos:
- id: unconditional_rna_16mer
  title: Unconditional 16-nucleotide RNA
  purpose: Generate one RNA structure from an RFD3NA polymer-aware contig.
  context: >-
    The R suffix selects RNA for all 16 generated residues. This is a minimal
    synthetic design case and does not assert biological function or stability.
