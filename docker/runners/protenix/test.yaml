version: 1
collections:
  smoke:
    cases:
    - id: minimal-protenix-v2-prediction
      task: protenix_predict
      input:
        files:
        - tests/data/protenix/minimal.json
      parameters:
        num_cycles: 1
        diffusion_steps: 2
        samples_per_seed: 1
        seed: 7
        num_seeds: 1
        use_msa: false
        use_templates: false
        use_rna_msa: false
        include_atom_confidence: false
        use_tfg_guidance: false
        triangle_multiplicative_kernel: torch
        triangle_attention_kernel: torch
        enable_shared_cache: true
        enable_fusion: false
        enable_tf32: true
