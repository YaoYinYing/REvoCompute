api_version: 1
id: opendde
version: '1'
runtime:
  docker_image: revodesign-revocompute-runner-opendde
  slurm_image: /mnt/data/srv/revodesign/server-slurm/images/opendde_v1.sif
  definition: opendde.def
  dockerfile: Dockerfile
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/opendde/task.yaml
contributions:
  input_workspace_plugins:
  - id: jaag-builder
    module: workspace/jaag-builder/index.js
    styles:
    - workspace/jaag-builder/style.css
    configuration_schema: workspace/jaag-builder/schema.json
