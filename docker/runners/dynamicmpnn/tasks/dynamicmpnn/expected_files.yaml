# Logical result files published by the dynamicMPNN Task.
#
# Derived from the production result recorded in the Task's evidence packet: one
# FASTA holding the wild-type query and the design, and the per-design backbone
# the model wrote beside it. Backbones are published structures but are not the
# primary view's candidate source, so they are declared artifacts. The input
# structure, submission, citation and execution records are provenance and
# diagnostics.
result:
  files:
    designs:
      pattern: 'seqs/*.fa'
      cardinality: one
      required: true
      type: fasta
      role: evidence
    backbones:
      pattern: 'backbones/*.pdb'
      cardinality: many
      required: true
      type: structure
      role: artifact
    input_structure:
      pattern: 'debug/inputs/structure/*.pdb'
      cardinality: one
      required: true
      type: structure
      role: provenance
    submission:
      path: debug/submission.json
      cardinality: one
      required: true
      type: json
      role: provenance
    citations:
      path: citations.bib
      cardinality: one
      required: true
      type: text
      role: provenance
    execution_records:
      pattern: 'execution/*'
      cardinality: many
      required: true
      type: text
      role: diagnostic
