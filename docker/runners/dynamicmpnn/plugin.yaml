api_version: 1
id: dynamicmpnn
version: '1'
runtime:
  image_artifact: dynamicmpnn_v1.sif
  definition: dynamicmpnn.def
  build_inputs:
  - dynamicmpnn/requirements.lock
  - dynamicmpnn/run.sh
  - dynamicmpnn/model-assets.sha256
  # Family adapter code is still baked here; migration to runtime_overlay is deferred (docs/runner-guide/runtime-bundles.md).
  runtime_overlay:
  - common/runtime/verify_model_asset.sh
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/dynamicmpnn/task.yaml
