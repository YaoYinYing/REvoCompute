id: gnina
display_name: Gnina
category: docking
summary: GPU molecular docking in an explicit Cartesian search box with Vina-derived search and CNN rescoring.
use_when: Use this for CNN-scored protein-small-molecule docking.
input_summary: One receptor PDB and one ligand SDF or MOL2 structure.
output_summary: Native docked SDF and log with normalized Vina and CNN pose scores.
considerations:
- Search-box placement is a scientific input; review Vina energies and CNN metrics independently.
gpus: true
inputs:
  receptor:
    title: Receptor
    type: protein_structure
    cardinality: {min: 1, max: 1}
    formats: [pdb]
  ligand:
    title: Ligand
    type: small_molecule_3d
    cardinality: {min: 1, max: 1}
    formats: [sdf, mol2]
input_workspace:
  steps:
  - id: structures
    title: Provide structures
    description: Bind the receptor and ligand to their named slots.
    capabilities:
    - plugin: files
      id: source_files
      title: Docking structures
  - id: settings
    title: Set CNN search
    description: Choose search effort and CNN mode.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Gnina settings
  - id: review
    title: Review and run
    description: Confirm structures and CNN mode.
    capabilities:
    - plugin: review
      id: submission_review
      title: Docking review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: docked_poses
    role: primary
    title: CNN-ranked poses
    description: Gnina SDF poses and scores.
    sources:
      candidates:
      - path: gnina.sdf
        required: true
      supporting:
      - path: scores.csv
        required: true
    mapping: {}
  - plugin: evidence-bundle
    id: docking_run
    role: evidence
    title: Docking evidence
    description: Gnina log and resolved run provenance.
    sources:
      items:
      - {path: gnina.log, required: true}
      - {path: gnina-run.json, required: true}
      - {path: summary.json, required: true}
    mapping: {}
stage_markers:
  dock: Gnina search and CNN scoring
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    center_x:
      type: number
      description: Search-box center X coordinate in angstroms.
      default: 0.0
      minimum: -10000.0
      maximum: 10000.0
    center_y:
      type: number
      description: Search-box center Y coordinate in angstroms.
      default: 0.0
      minimum: -10000.0
      maximum: 10000.0
    center_z:
      type: number
      description: Search-box center Z coordinate in angstroms.
      default: 0.0
      minimum: -10000.0
      maximum: 10000.0
    size_x:
      type: number
      description: Search-box size along X in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 126.0
    size_y:
      type: number
      description: Search-box size along Y in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 126.0
    size_z:
      type: number
      description: Search-box size along Z in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 126.0
    exhaustiveness:
      type: integer
      description: Number of Vina-derived search iterations.
      default: 8
      minimum: 1
      maximum: 64
    cnn_scoring:
      type: string
      description: CNN use during docking and rescoring.
      default: rescore
      enum:
      - none
      - rescore
      - refinement
      - all
citations:
- num: 1
  doi: 10.1186/s13321-025-00973-x
  bibtex: >-
    @article{McNutt_2025, title={GNINA 1.3: the next increment in molecular docking with deep learning}, volume={17}, ISSN={1758-2946}, url={http://dx.doi.org/10.1186/s13321-025-00973-x}, DOI={10.1186/s13321-025-00973-x}, number={1}, journal={Journal of Cheminformatics}, publisher={Springer Science and Business Media LLC}, author={McNutt, Andrew T. and Li, Yanjing and Meli, Rocco and Aggarwal, Rishal and Koes, David Ryan}, year={2025}, month=Mar }
