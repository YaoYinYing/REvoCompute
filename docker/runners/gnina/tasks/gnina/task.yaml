id: gnina
display_name: Gnina
category: docking
summary: GPU molecular docking with Vina-derived search and CNN rescoring.
use_when: Use this for CNN-scored protein-small-molecule docking.
input_summary: One receptor PDB and one ligand SDF or MOL2 structure.
output_summary: Ranked docked ligand SDF with CNN scores.
considerations:
- Autoboxing uses the submitted ligand; review poses and CNN confidence independently.
gpus: true
input_extension: .pdb
input_extensions:
- .pdb
- .sdf
- .mol2
primary_input_extensions:
- .pdb
allow_multiple_inputs: false
max_input_files: 2
input_label: Receptor PDB and ligand structure
input_workspace:
  steps:
  - id: structures
    title: Provide structures
    description: Upload receptor then ligand.
    capabilities:
    - plugin: files
      id: source_files
      title: Docking structures
      options:
        primary_required: true
  - id: settings
    title: Set CNN search
    description: Choose search effort and CNN mode.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Gnina settings
  - id: review
    title: Review and run
    description: Confirm structures and CNN mode.
    capabilities:
    - plugin: review
      id: submission_review
      title: Docking review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: docked_poses
    role: primary
    title: CNN-ranked poses
    description: Gnina SDF poses and scores.
    sources:
      candidates:
      - path: gnina.sdf
        required: true
    mapping: {}
  - plugin: evidence-bundle
    id: docking_run
    role: evidence
    title: Docking evidence
    description: Gnina log and resolved run provenance.
    sources:
      items:
      - {path: gnina.log, required: true}
      - {path: gnina-run.json, required: true}
    mapping: {}
stage_markers:
  dock: Gnina search and CNN scoring
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    autobox_add:
      type: number
      description: Padding added around the ligand autobox in angstroms.
      default: 4.0
      minimum: 0.0
      maximum: 20.0
    exhaustiveness:
      type: integer
      description: Number of Vina-derived search iterations.
      default: 8
      minimum: 1
      maximum: 64
    cnn_scoring:
      type: string
      description: CNN use during docking and rescoring.
      default: rescore
      enum:
      - none
      - rescore
      - refinement
      - all
citation_dois:
- num: 1
  doi: 10.1186/s13321-025-00973-x
  title: 'GNINA 1.3: the next increment in molecular docking with deep learning'
citation_bibtex: '@article{McNutt_2025, title={GNINA 1.3: the next increment in molecular
  docking with deep learning}, volume={17}, ISSN={1758-2946}, url={http://dx.doi.org/10.1186/s13321-025-00973-x},
  DOI={10.1186/s13321-025-00973-x}, number={1}, journal={Journal of Cheminformatics},
  publisher={Springer Science and Business Media LLC}, author={McNutt, Andrew T. and
  Li, Yanjing and Meli, Rocco and Aggarwal, Rishal and Koes, David Ryan}, year={2025},
  month=Mar }'
