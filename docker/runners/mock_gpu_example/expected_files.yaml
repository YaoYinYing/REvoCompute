result:
  files:
    # One FASTA record is one work item, committed as its own directory. The
    # per-item artifact is therefore many, and the task-level rollup is the one
    # file that describes the whole submission.
    mock_samples:
      pattern: '*/mock_samples.json'
      cardinality: many
      required: true
      type: json
    item_summary:
      pattern: '*/summary.json'
      cardinality: many
      required: true
      type: json
    task_summary:
      path: task_summary.json
      cardinality: one
      required: true
      type: json
