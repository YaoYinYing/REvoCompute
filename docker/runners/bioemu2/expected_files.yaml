# Logical result files published by the legacy BioEmu2 equilibrium and
# structure prediction Tasks, which share this contract because both call an
# upstream sampling entry point with an identical output set. The unified
# `bioemu2` Task owns `tasks/bioemu2/expected_files.yaml`, which drops the FASTA
# echo and declares `command.txt` optional.
#
# The Runner owns this judgement. Allowed `role:` values are evidence |
# provenance | diagnostic | artifact. `topology.cif` is upstream's topology for
# `samples.xtc`; the declared trajectory view reads it as mmCIF. `samples.xtc`,
# `physicality.json`, and `system.yaml` are written by upstream
# `sample_equilibrium` or `predict_structure`; `sequence.fasta` echoes the named
# input sequence.
result:
  files:
    topology:
      path: topology.cif
      cardinality: one
      required: true
      type: structure
      role: artifact
    coordinates:
      path: samples.xtc
      cardinality: one
      required: true
      role: evidence
    sequence:
      path: sequence.fasta
      cardinality: one
      required: true
      type: fasta
      role: artifact
    physicality:
      path: physicality.json
      cardinality: one
      required: true
      type: json
      role: diagnostic
    system:
      path: system.yaml
      cardinality: one
      required: true
      type: text
      role: provenance
