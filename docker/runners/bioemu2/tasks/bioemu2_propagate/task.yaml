display_name: BioEmu2 propagation
category: structure
id: bioemu2_propagate
summary: Sample endpoints at a time lag from one starting structure with BioEmu2.
use_when: Use this to propagate one all-atom starting structure forward by a fixed lag;
  choose the equilibrium Task when you need an ensemble from a sequence instead.
input_summary: One all-atom structure in mmCIF, plus an optional explicit BioEmu2
  system YAML. Without the YAML the molecular system is inferred from the CIF atoms,
  standard residues, and supported ligands; a CIF whose explicit connections or
  branched entities cannot be inferred is refused rather than altered.
output_summary: Independent endpoints at the requested lag, the matching topology,
  per-endpoint physicality results, and the resolved sampling system.
considerations:
- The endpoints are independent samples at one lag from the same starting structure,
  not a time-ordered trajectory; frame order is input order.
- The molecular system is inferred from the starting CIF unless a system YAML is
  supplied, and the CIF atoms must match that system exactly, including atom order.
  Upstream does not import explicit `_struct_conn` connections or branched entities
  from the CIF, so a CIF containing them is refused unless the matching system YAML
  declares them. A ligand that CIF inference represents is kept; presence of a ligand
  alone is not a reason for refusal. Exactly one starting structure is accepted per
  run.
- Physicality checking reports per-endpoint results in physicality.json; every endpoint
  is retained and none is removed because of the report.
- BioEmu2 queries the public ColabFold MMseqs2 service (api.colabfold.com) for the
  system alignment on every run.
- Ligand steering uses the pinned Boltz-1 CCD dictionary. A ligand code absent from
  that dictionary, such as a novel predicted ligand, is sampled without
  ligand-specific steering constraints; the rest of the system and the physicality
  check are unchanged.
- The released checkpoint is a preview; upstream tested it with an 80 GB A100 as the
  smallest device.
requires_network: true
gpus: true
inputs:
  starting_structure:
    title: Starting structure
    type: protein_structure
    cardinality: {min: 1, max: 1}
    formats: [cif]
    description: Exactly one all-atom mmCIF structure. Its atoms and their order must
      match the system BioEmu2 infers from it, or the system declared alongside it.
  system:
    title: Explicit system definition (optional)
    type: supporting_data
    cardinality: {min: 0, max: 1}
    formats: [yaml, yml]
    description: Optional BioEmu2 system YAML that declares the entities and bonds
      CIF inference cannot reproduce. Its atoms must match the starting structure
      exactly; a mismatched system is refused before sampling.
input_workspace:
  steps:
  - id: material
    title: Provide the structure and system
    description: Upload the CIF structure to propagate, plus an optional system YAML
      when explicit connections or branched entities need a declared definition.
    capabilities:
    - plugin: files
      id: source_files
      title: Structure files
    - plugin: structure
      id: structure_summary
      title: Inspect the structure
      options:
        source: source_files
        select_chains: false
        select_residues: false
  - id: settings
    title: Set the experiment
    description: Adjust only the controls that matter for this run
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the structure and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: trajectory
    id: propagated_endpoints
    role: primary
    title: Propagated endpoints
    description: Independent endpoints sampled at one lag time from the starting
      structure; frame order is input order, not physical time.
    sources:
      topology:
      - path: topology.cif
        required: true
      coordinates:
      - path: samples.xtc
        required: true
    mapping:
      coordinate_format: xtc
      topology_format: mmcif
      frame_unit: endpoint
      timestep: 1
      association: single
stage_markers:
  bioemu2_propagate: BioEmu2 propagation
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    lag_time_ns:
      type: number
      description: Time lag in nanoseconds for each endpoint. Upstream recommends 1 to
        1000 ns, the range the model mostly saw during training.
      default: 1.0
      exclusiveMinimum: 0
      maximum: 1000
    num_samples:
      type: integer
      description: Number of independent endpoints to sample from the starting structure.
      default: 1
      minimum: 1
      maximum: 1000
    sampler:
      type: string
      description: Sampling algorithm; edm is unsteered, edm_gd uses gradient guidance,
        edm_fk adds Feynman-Kac resampling, and edm_fkc uses the Feynman-Kac corrector
        with the default physicality potentials.
      default: edm
      enum:
      - edm
      - edm_gd
      - edm_fk
      - edm_fkc
    num_steps:
      type: integer
      description: Number of denoising steps; when omitted the sampler's configured step
        count applies.
      minimum: 1
      maximum: 1000
    batch_size:
      type: integer
      description: Number of endpoints denoised together; when omitted the sample
        count is used.
      minimum: 1
      maximum: 1000
    physicality_mode:
      type: string
      description: Physicality thresholds reported per endpoint for invalid bond lengths,
        clashes, chirality, and chain breaks; no_filter still writes physicality.json
        with each endpoint's status reported as not checked, and no endpoint is removed.
      default: high_quality
      enum:
      - no_filter
      - no_violations
      - high_quality
      - high_quality_per_residue
    seed:
      type: integer
      x-ui-control: {kind: seed}
      description: Optional random seed; when omitted repeated runs generally produce
        different endpoints.
      minimum: 0
      maximum: 2147483647
