id: ppiformer_ddg
display_name: PPIformer mutation ddG
category: fitness
citations:
- num: 1
  doi: 10.48550/arXiv.2310.18515
  bibtex: >-
    @misc{https://doi.org/10.48550/arxiv.2310.18515,
    doi = {10.48550/ARXIV.2310.18515},
    url = {https://arxiv.org/abs/2310.18515},
    author = {Bushuiev, Anton and Bushuiev, Roman and Kouba, Petr and Filkin, Anatolii and Gabrielova, Marketa and Gabriel, Michal and Sedlar, Jiri and Pluskal, Tomas and Damborsky, Jiri and Mazurenko, Stanislav and Sivic, Josef},
    keywords = {Machine Learning (cs.LG), FOS: Computer and information sciences, FOS: Computer and information sciences},
    title = {Learning to design protein-protein interactions with enhanced generalization},
    publisher = {arXiv},
    year = {2023},
    copyright = {arXiv.org perpetual, non-exclusive license}
    }

summary: Predict mutation-induced binding free-energy changes for a protein-protein interface.
use_when: Use this to score specified single or combined substitutions in a structurally resolved protein complex.
input_summary: One PDB file named with PPIRef partner notation, such as 1bui_A_C.pdb.
output_summary: Ensemble mean binding ddG predictions and exact model/input provenance.
considerations:
- Negative predicted ddG indicates a mutation predicted to strengthen binding; predictions require experimental
  validation.
- PDB filenames must encode the two partner chain groups as <pdb-id>_<partner-1>_<partner-2>.pdb.
gpus: true
inputs:
  complex:
    title: Protein-protein complex
    type: protein_structure
    cardinality: {min: 1, max: 1}
    formats: [pdb]
input_workspace:
  steps:
  - id: material
    title: Provide the complex
    description: Choose the protein-protein complex named with PPIRef partner notation
    capabilities:
    - plugin: files
      id: source_files
      title: Structure files
    - plugin: structure
      id: structure_summary
      title: Inspect the structure
      options:
        source: source_files
        select_chains: false
        select_residues: false
  - id: settings
    title: Set the experiment
    description: Define the design or analysis settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the structure and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: entity-table
    id: ddg_predictions
    role: primary
    title: Mutation ddG predictions
    description: Ensemble predictions for each submitted single or combined mutation.
    sources:
      table: [{path: ddg_predictions.csv, required: true}]
    mapping:
      entity: mutation
      key_columns: [mutation]
      evidence_columns: [predicted_ddg_kcal_mol]
  - plugin: evidence-bundle
    id: ddg_provenance
    role: evidence
    title: Prediction provenance
    description: Input, software revision, model checksums, and effective parameters.
    sources:
      items: [{path: run_metadata.json, required: true}]
    mapping: {}
stage_markers: {ppiformer_ddg: PPIformer mutation ddG prediction}
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [mutations]
  properties:
    mutations:
      type: string
      description: Mutation variants separated by newlines or semicolons; comma joins substitutions in one combined
        variant (for example SC16A,FC47A).
      minLength: 4
      maxLength: 8192
    impute_missing:
      type: boolean
      description: Assign the published SKEMPI training-set mean to substitutions outside the extracted interface.
      default: false
