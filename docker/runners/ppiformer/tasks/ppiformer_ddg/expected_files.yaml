# Logical result files published by the PPIformer ddG Task.
#
# Derived from the production result recorded in the Task's evidence packet:
# one ensemble ddG table and the run metadata that names the mutation, model
# revision and checkpoint digests, plus the input complex, submission, citation
# and execution provenance.
result:
  files:
    ddg_predictions:
      path: ddg_predictions.csv
      cardinality: one
      required: true
      type: table
      role: evidence
    run_metadata:
      path: run_metadata.json
      cardinality: one
      required: true
      type: json
      role: evidence
    input_complex:
      pattern: 'debug/inputs/complex/*.pdb'
      cardinality: one
      required: true
      type: structure
      role: provenance
    submission:
      path: debug/submission.json
      cardinality: one
      required: true
      type: json
      role: provenance
    citations:
      path: citations.bib
      cardinality: one
      required: true
      type: text
      role: provenance
    execution_records:
      pattern: 'execution/*'
      cardinality: many
      required: true
      type: text
      role: diagnostic
