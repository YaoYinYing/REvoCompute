api_version: 1
id: ppiformer
version: '1'
runtime:
  image_artifact: ppiformer_v1.sif
  definition: ppiformer.def
  build_inputs:
  - ppiformer/run.sh
  - ppiformer/predict.py
  - ppiformer/requirements.txt
  - ppiformer/requirements.lock
  - ppiformer/model-assets.sha256
  # Family adapter code is still baked here; migration to runtime_overlay is deferred (docs/runner-guide/runtime-bundles.md).
  runtime_overlay:
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  entrypoint: [bash, /app/revocompute/run.sh]
tasks:
- tasks/ppiformer_ddg/task.yaml
- tasks/ppiformer_embed/task.yaml
