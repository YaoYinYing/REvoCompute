summary: ColabFold AlphaFold2 prediction with online MMseqs2 MSA search and local
  GPU inference.
use_when: Use this for AlphaFold2 prediction with public MMseqs2 MSA search and local
  model inference.
input_summary: One FASTA file; multiple records represent a complex.
output_summary: The searched alignment, ranked predicted structures, scores, and optional
  relaxed models.
considerations:
- MSA generation depends on the external ColabFold service unless single-sequence
  mode is selected.
gpus: true
inputs:
  sequence:
    title: Protein sequence
    type: protein_sequence
    cardinality: {min: 1, max: 1}
    formats: [fasta, fa, faa]
input_workspace:
  steps:
  - id: material
    title: Provide the protein sequence
    description: Upload FASTA files or paste one protein sequence
    capabilities:
    - plugin: files
      id: source_files
      title: Sequence files
    - plugin: sequence
      id: sequence_editor
      title: Paste a sequence
      options: {role: sequence}
  - id: settings
    title: Set the experiment
    description: Adjust only the controls that matter for this run
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the sequence and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: ranked_models
    role: primary
    title: Ranked structure models
    description: Predicted structures in the ranking order published by ColabFold.
    sources:
      candidates:
      - glob: '*_rank_*.pdb'
        required: true
    mapping:
      confidence_encoding: plddt_bfactor
  - plugin: metric-series
    id: residue_confidence
    role: evidence
    title: Per-residue model confidence
    description: Per-residue pLDDT confidence for each ranked model.
    sources:
      series:
      - glob: '*_scores_rank_*.json'
        required: true
    mapping:
      format: json
      value_path: plddt
      x_label: Residue position
      y_label: pLDDT
      unit: score
      direction: higher
      missing: 'null'
      y_min: 0
      y_max: 100
  - plugin: matrix
    id: predicted_aligned_error
    role: evidence
    title: Predicted aligned error
    description: Pairwise predicted aligned error; lower values indicate greater confidence
      in relative residue placement.
    sources:
      matrices:
      - glob: '*_predicted_aligned_error_*.json'
        required: true
    mapping:
      format: json
      value_path: predicted_aligned_error
      x_label: Aligned residue
      y_label: Scored residue
      unit: "\xC5"
      direction: lower
      scale: sequential
      scale_min: 0
      scale_max: 31.75
  - plugin: scalar-summary
    id: global_confidence
    role: evidence
    title: Global model confidence
    description: Global confidence values published with each ColabFold model.
    sources:
      data:
      - glob: '*_scores_rank_*.json'
        required: true
    mapping:
      fields:
      - path: ptm
        label: pTM
        unit: score
        direction: higher
      - path: max_pae
        label: Maximum PAE
        unit: "\xC5"
        direction: lower
  - plugin: alignment
    id: model_alignment
    role: evidence
    title: Model input alignment
    description: The A3M alignment supplied to model inference, with sequence-based
      residue numbering.
    sources:
      alignment:
      - glob: '*.a3m'
        required: true
    mapping:
      format: a3m
      numbering: sequence
  - plugin: scalar-summary
    id: interface_confidence
    role: evidence
    title: Interface confidence
    description: Interface confidence for the best-scoring chain pair of a complex
      prediction, as computed by ColabFold for that ranked model. The view is absent
      for single-chain predictions, which have no interface.
    sources:
      data:
      - glob: interface_scores.json
        required: false
    mapping:
      fields:
      - path: ipsae
        label: ipSAE
        unit: score
        direction: higher
      - path: pdockq2
        label: pDockQ2
        unit: score
        direction: higher
stage_markers:
  msa_searching: MSA searching
  modeling: Folding models
workflow:
- name: features
  display_name: MSA and features
  requires_gpu: false
  requires_network: true
  runner_args:
  - -s
  - features
  stage_markers:
  - msa_searching
- name: model
  display_name: Model and optional relax
  requires_gpu: true
  runner_args:
  - -s
  - model
  stage_markers:
  - modeling
id: colabfold_af2
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    model_type:
      type: string
      description: AlphaFold2 model family selected for monomer, pTM, or multimer prediction.
      default: auto
      enum:
      - auto
      - alphafold2
      - alphafold2_ptm
      - alphafold2_multimer_v3
    msa_mode:
      type: string
      description: Multiple-sequence-alignment search strategy, including environmental sequences or single-sequence inference.
      default: mmseqs2_uniref_env
      enum:
      - mmseqs2_uniref_env
      - mmseqs2_uniref
      - single_sequence
    num_recycle:
      type: integer
      description: Number of AlphaFold recycling iterations used to refine each prediction.
      default: 3
      minimum: 0
      maximum: 20
    num_models:
      type: integer
      description: Number of distinct AlphaFold parameter models evaluated per seed.
      default: 5
      minimum: 1
      maximum: 5
    num_seeds:
      type: integer
      description: Number of random seeds evaluated for each selected model.
      default: 1
      minimum: 1
      maximum: 20
    random_seed:
      type: integer
      x-ui-control: {kind: seed}
      description: Initial random seed for model inference and stochastic feature processing.
      default: 0
      minimum: 0
    num_relax:
      type: integer
      description: Number of top-ranked structures relaxed with OpenMM Amber after prediction.
      default: 1
      minimum: 0
      maximum: 5
    use_fast_kernels:
      type: boolean
      description: Uses the fused triangle and attention kernels instead of the default
        XLA path, which trades compile time and additional GPU memory for faster
        folding of large complexes. Requires bfloat16 inference, so it is rejected
        for the fp16-only legacy kernel backend.
      default: false
    kernel_backend:
      type: string
      description: Kernel family used when fused kernels are enabled; "auto" selects
        the Pallas kernels on Ampere and newer GPUs and the pre-Ampere CUDA kernels
        otherwise, while an explicit choice overrides that capability check.
      default: auto
      enum:
      - auto
      - pallas
      - cuda_legacy
    compile_mode:
      type: string
      description: Kernel autotuning effort used when compiling a model shape, from
        fastest compilation with a small inference penalty to unbounded autotuning
        that can spend tens of minutes compiling long sequences.
      default: tuned
      enum:
      - fast
      - tuned
      - full
