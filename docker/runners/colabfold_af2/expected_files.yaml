result:
  files:
    structures:
      pattern: '*_rank_*.pdb'
      cardinality: many
      required: true
      type: structure
    scores:
      pattern: '*_scores_rank_*.json'
      cardinality: many
      required: true
      type: json
    alignment:
      pattern: '*.a3m'
      # ColabFold creates one job per FASTA record and writes one A3M per job.
      cardinality: many
      required: true
      type: alignment
    interface_scores:
      path: colabfold/interface_scores.json
      cardinality: one
      required: false
      type: json
