mounts:
  - host_path: "/mnt/db/weights/bioemu"
    container_path: "/mnt/db/weights/bioemu"
    mode: "ro"
  - host_path: "/mnt/db/weights/alphafold/colabfold"
    container_path: "/mnt/models/.cache/colabfold"
    mode: "ro"
env:
  BIOEMU_CHECKPOINT_ROOT: "/mnt/db/weights/bioemu/checkpoints/bioemu-v1.1"
  HOME: "/mnt/models"
  XDG_CACHE_HOME: "/mnt/models/.cache"
max_runtime_seconds: 7200
