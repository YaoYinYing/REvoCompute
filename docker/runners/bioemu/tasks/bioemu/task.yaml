display_name: BioEmu
category: structure
citation_dois:
- num: 1
  doi: 10.1126/science.adv9817
  title: Scalable emulation of protein equilibrium ensembles with generative deep
    learning
summary: Conformational ensemble sampling from sequence (BioEmu).
use_when: Use this to sample a diverse conformational ensemble from one protein sequence.
input_summary: One protein sequence as FASTA.
output_summary: A filtered ensemble of sampled protein conformations and supporting
  artifacts.
considerations:
- A generated ensemble is a model sample and not a measured thermodynamic population.
gpus: true
input_extension: .fasta
input_label: FASTA file
input_workspace:
  steps:
  - id: material
    title: Provide the protein sequence
    description: Upload FASTA files or paste one protein sequence
    capabilities:
    - plugin: files
      id: source_files
      title: Sequence files
      options:
        primary_required: true
    - plugin: sequence
      id: sequence_editor
      title: Paste a sequence
  - id: settings
    title: Set the experiment
    description: Adjust only the controls that matter for this run
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the sequence and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: trajectory
    id: conformational_ensemble
    role: primary
    title: Sampled conformational ensemble
    description: Filtered BioEmu samples associated with the declared PDB topology;
      sample order is not physical time.
    sources:
      topology:
      - path: topology.pdb
        required: true
      coordinates:
      - path: samples.xtc
        required: true
    mapping:
      coordinate_format: xtc
      frame_unit: sample
      timestep: 1
      association: single
stage_markers:
  bioemu: BioEmu structure sampling
id: bioemu
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    num_samples:
      type: integer
      description: Total number of equilibrium protein conformations to generate.
      default: 10
      minimum: 1
      maximum: 1000
    batch_size_100:
      type: integer
      description: Sampling batch size used for proteins of approximately 100 residues,
        scaled internally by sequence length.
      default: 10
      minimum: 1
      maximum: 100
    denoiser_type:
      type: string
      description: Numerical denoising solver used during diffusion sampling.
      default: dpm
      enum:
      - dpm
      - heun
    filter_samples:
      type: boolean
      description: Rejects generated conformations that fail BioEmu physical-validity
        filters.
      default: true
    base_seed:
      type: integer
      x-ui-control: seed
      description: Optional base random seed used to make sampling reproducible.
      minimum: 0
citation_bibtex: '@article{Lewis_2025, title={Scalable emulation of protein equilibrium
  ensembles with generative deep learning}, volume={389}, ISSN={1095-9203}, url={http://dx.doi.org/10.1126/science.adv9817},
  DOI={10.1126/science.adv9817}, number={6761}, journal={Science}, publisher={American
  Association for the Advancement of Science (AAAS)}, author={Lewis, Sarah and Hempel,
  Tim and Jiménez-Luna, José and Gastegger, Michael and Xie, Yu and Foong, Andrew
  Y. K. and Satorras, Victor García and Abdin, Osama and Veeling, Bastiaan S. and
  Zaporozhets, Iryna and Chen, Yaoyi and Yang, Soojung and Foster, Adam E. and Schneuing,
  Arne and Nigam, Jigyasa and Barbero, Federico and Stimper, Vincent and Campbell,
  Andrew and Yim, Jason and Lienen, Marten and Shi, Yu and Zheng, Shuxin and Schulz,
  Hannes and Munir, Usman and Sordillo, Roberto and Tomioka, Ryota and Clementi, Cecilia
  and Noé, Frank}, year={2025}, month=Aug }'
