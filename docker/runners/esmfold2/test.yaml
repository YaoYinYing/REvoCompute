version: 1
collections:
  smoke:
    cases:
    - id: minimal-esmfold2-fast
      task: esmfold2_predict
      input: {files: [tests/data/esmfold2/minimal.fasta]}
      parameters:
        model_variant: fast
        num_loops: 1
        num_sampling_steps: 2
        num_diffusion_samples: 1
        seed: 0
        lm_dropout: 0.0
        lm_mask_pct: 0.0
        msa_max_depth: 16
        msa_column_mask_rate: 0.0
        kernel_backend: cuequivariance
        include_embeddings: false
