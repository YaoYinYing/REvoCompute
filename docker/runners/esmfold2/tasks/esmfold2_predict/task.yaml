parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    model_variant:
      type: string
      description: Released ESMFold 2 checkpoint; standard accepts MSA conditioning
        and fast is optimized for single-sequence prediction.
      default: fast
      enum:
      - fast
      - standard
    num_loops:
      type: integer
      description: Number of folding-trunk refinement loops.
      default: 3
      minimum: 1
      maximum: 20
    num_sampling_steps:
      type: integer
      description: Number of diffusion denoising steps used for each structure sample.
      default: 50
      minimum: 1
      maximum: 200
    num_diffusion_samples:
      type: integer
      description: Number of independently sampled structures returned for the input.
      default: 1
      minimum: 1
      maximum: 8
    seed:
      type: integer
      x-ui-control: seed
      description: Random seed for feature preparation and diffusion sampling.
      default: 0
      minimum: 0
      maximum: 2147483647
    lm_dropout:
      type: number
      description: Dropout applied to language-model embeddings during folding; zero
        disables it.
      default: 0.0
      minimum: 0.0
      maximum: 0.5
    lm_mask_pct:
      type: number
      description: Fraction of protein residues masked before ESMC embedding.
      default: 0.0
      minimum: 0.0
      maximum: 0.5
    msa_max_depth:
      type: integer
      description: Maximum number of alignment rows retained when an A3M is supplied.
      default: 1024
      minimum: 1
      maximum: 4096
    msa_column_mask_rate:
      type: number
      description: Fraction of MSA columns masked once before folding.
      default: 0.1
      minimum: 0.0
      maximum: 0.5
    kernel_backend:
      type: string
      description: Triangle-update kernel implementation; reference prioritizes portability
        and cuequivariance uses the pinned CUDA kernels.
      default: cuequivariance
      enum:
      - reference
      - cuequivariance
    include_embeddings:
      type: boolean
      description: Save pooled pair embeddings for downstream analysis; this can produce
        a large artifact.
      default: false
