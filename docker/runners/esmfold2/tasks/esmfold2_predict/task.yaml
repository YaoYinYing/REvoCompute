id: esmfold2_predict
display_name: ESMFold 2 structure prediction
category: structure
summary: Predict all-atom protein structures with ESMFold 2 from sequence and optional
  MSA context.
use_when: Use this for single-chain or protein-complex prediction with the released
  ESMFold 2 models.
input_summary: One protein FASTA; an optional A3M alignment is accepted for a single-chain
  standard-model prediction.
output_summary: One mmCIF structure per diffusion sample with global confidence, per-token
  pLDDT, PAE, and provenance.
considerations:
- Predicted structures and confidence values are computational estimates and require
  scientific interpretation.
- The fast model is single-sequence only; use the standard model when supplying an
  MSA.
- Runtime and GPU memory grow approximately quadratically with total token count and
  with the number of diffusion samples.
gpus: true
input_extension: .fasta
input_extensions:
- .fasta
- .fa
- .faa
- .a3m
primary_input_extensions:
- .fasta
- .fa
- .faa
input_label: Protein sequence and optional alignment
min_input_files: 1
max_input_files: 2
input_workspace:
  steps:
  - id: material
    title: Provide the protein system
    description: Upload or paste protein sequences and optionally attach a single-chain
      A3M
    capabilities:
    - plugin: files
      id: source_files
      title: Protein FASTA and optional A3M
      options:
        primary_required: true
    - plugin: sequence
      id: sequence_editor
      title: Protein sequences
  - id: settings
    title: Set the prediction
    description: Choose the released model and bounded sampling controls
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: ESMFold 2 settings
  - id: review
    title: Review and run
    description: Check the molecular system and inference settings
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: predicted_structures
    role: primary
    title: Predicted structures
    description: All-atom ESMFold 2 samples in deterministic sample order.
    sources:
      candidates:
      - glob: sample_*.cif
        required: true
    mapping:
      confidence_encoding: plddt_bfactor
  - plugin: scalar-summary
    id: global_confidence
    role: evidence
    title: Global confidence
    description: Per-sample pLDDT, pTM, and ipTM summary values.
    sources:
      data:
      - glob: sample_*_confidence.json
        required: true
    mapping:
      fields:
      - path: mean_plddt
        label: Mean pLDDT
        unit: score
        direction: higher
      - path: ptm
        label: pTM
        unit: score
        direction: higher
        nullable: true
      - path: iptm
        label: ipTM
        unit: score
        direction: higher
        nullable: true
  - plugin: metric-series
    id: residue_confidence
    role: evidence
    title: Per-token confidence
    description: ESMFold 2 pLDDT confidence in input token order.
    sources:
      series:
      - glob: sample_*_plddt.csv
        required: true
    mapping:
      format: csv
      x_column: token_index
      value_columns:
      - plddt
      x_label: Token index
      y_label: pLDDT
      unit: score
      direction: higher
      missing: empty cell
      y_min: 0
      y_max: 1
  - plugin: matrix
    id: predicted_aligned_error
    role: evidence
    title: Predicted aligned error
    description: Pairwise predicted aligned error for each structure sample.
    sources:
      matrices:
      - glob: sample_*_pae.json
        required: true
    mapping:
      format: json
      value_path: pae
      x_label: Aligned token
      y_label: Scored token
      unit: angstrom
      direction: lower
      scale: sequential
  - plugin: evidence-bundle
    id: prediction_record
    role: evidence
    title: Prediction record
    description: Exact scientific settings, model revisions, input identity, and optional
      embeddings.
    sources:
      items:
      - glob: prediction.json
        required: true
      - glob: sample_*_embeddings.npz
        required: false
    mapping: {}
stage_markers:
  esmfold2_predict: ESMFold 2 inference
