summary: AlphaFold2 inference with a query-only MSA (the input sequence is the only
  MSA row) and no MSA or template search.
use_when: Use this to fold one protein chain from its sequence alone, without
  database searches, when no MSA information is available or wanted.
input_summary: One single-record FASTA file containing one protein chain.
output_summary: Ranked predicted structures, confidence data, query-only features,
  and optional relaxed models.
considerations:
- The input sequence is the only MSA row (depth one). No MSA search, no template
  search, and no template information reaches the model.
- Only one protein chain is supported. Multi-record FASTA input and multimer
  presets are rejected.
- Accuracy and confidence are typically lower than MSA-assisted AlphaFold2, because
  the model receives no evolutionary or structural context.
gpus: true
inputs:
  sequence:
    title: Protein sequence
    type: single_protein_sequence
    cardinality: {min: 1, max: 1}
    formats: [fasta, fa, faa]
input_workspace:
  steps:
  - id: material
    title: Provide the protein sequence
    description: Upload a single-record FASTA file or paste one protein sequence
    capabilities:
    - plugin: files
      id: source_files
      title: Sequence files
    - plugin: sequence
      id: sequence_editor
      title: Paste a sequence
      options: {role: sequence}
  - id: settings
    title: Set the experiment
    description: Adjust only the controls that matter for this run
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the sequence and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: ranked_models
    role: primary
    title: Ranked structure models
    description: Predicted structures in the ranking order published by AlphaFold.
    sources:
      candidates:
      - glob: '*/ranked_*.pdb'
        required: true
    mapping:
      confidence_encoding: plddt_bfactor
  - plugin: metric-series
    id: residue_confidence
    role: evidence
    title: Per-residue model confidence
    description: Per-residue pLDDT confidence for each predicted model; higher values
      indicate greater local model confidence.
    sources:
      series:
      - glob: '*/confidence_*.json'
        required: true
    mapping:
      format: json
      value_path: confidenceScore
      x_label: Residue position
      y_label: pLDDT
      unit: score
      direction: higher
      missing: 'null'
      y_min: 0
      y_max: 100
  - plugin: matrix
    id: predicted_aligned_error
    role: evidence
    title: Predicted aligned error
    description: Pairwise predicted aligned error for each model; lower values indicate
      greater confidence in relative residue placement.
    sources:
      matrices:
      - glob: '*/pae_model_*.json'
        required: false
    mapping:
      format: json
      value_path: 0.predicted_aligned_error
      x_label: Aligned residue
      y_label: Scored residue
      unit: "\xC5"
      direction: lower
      scale: sequential
      scale_min: 0
      scale_max: 31.75
stage_markers:
  featuring: Query-only features
  modeling: Folding models
  relaxing: Amber relaxation
workflow:
- name: features
  display_name: Query-only features
  requires_gpu: false
  requires_network: false
  runner_args:
  - -s
  - features
  stage_markers:
  - featuring
  outputs:
  - name: features
    type: alphafold_features
    path: "*/features.pkl"
- name: model
  display_name: Model and relax
  requires_gpu: true
  requires_network: false
  runner_args:
  - -s
  - model
  inputs:
  - name: features
    type: alphafold_features
    from: alphafold_single_sequence.features:features
  stage_markers:
  - modeling
  - relaxing
execution_modes:
  full:
    label: Full prediction
    stages: [features, model]
  prepare_only:
    label: Preparation only
    stages: [features]
    output_contract: stages
  model_only:
    label: Model from prepared features
    stages: [model]
    output_contract: full
    reuse:
      model.features: {role: prepared_features, type: alphafold_features, inputs: [sequence]}
id: alphafold_single_sequence
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    model_preset:
      type: string
      description: AlphaFold monomer model configuration; multimer presets are not supported.
      default: monomer_ptm
      enum:
      - monomer
      - monomer_ptm
    models_to_relax:
      type: string
      description: Selects which predicted structures receive Amber relaxation after inference.
      default: best
      enum:
      - none
      - best
      - all
    benchmark:
      type: boolean
      description: Runs repeated model evaluation to report inference timing after JAX compilation.
      default: false
