summary: DeepMind AlphaFold2 structure prediction (JAX, multimer-capable).
use_when: Use this for local-database AlphaFold2 monomer or multimer prediction.
input_summary: One FASTA file; use multiple records for a multimer together with the
  multimer preset.
output_summary: Ranked predicted structures, confidence data, features, and optional
  relaxed models.
considerations:
- "MSA and template searches use the server\u2019s installed databases and can dominate\
  \ runtime."
gpus: true
input_extension: .fasta
input_extensions:
- .fasta
- .fa
- .faa
primary_input_extensions:
- .fasta
- .fa
- .faa
input_label: Protein sequence (FASTA)
input_workspace:
  steps:
  - id: material
    title: Provide the protein sequence
    description: Upload FASTA files or paste one protein sequence
    capabilities:
    - plugin: files
      id: source_files
      title: Sequence files
      options:
        primary_required: true
    - plugin: sequence
      id: sequence_editor
      title: Paste a sequence
  - id: settings
    title: Set the experiment
    description: Adjust only the controls that matter for this run
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the sequence and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: ranked_models
    role: primary
    title: Ranked structure models
    description: Predicted structures in the ranking order published by AlphaFold.
    sources:
      candidates:
      - glob: '*/ranked_*.pdb'
        required: true
    mapping:
      confidence_encoding: plddt_bfactor
  - plugin: metric-series
    id: residue_confidence
    role: evidence
    title: Per-residue model confidence
    description: Per-residue pLDDT confidence for each predicted model; higher values
      indicate greater local model confidence.
    sources:
      series:
      - glob: '*/confidence_*.json'
        required: true
    mapping:
      format: json
      value_path: confidenceScore
      x_label: Residue position
      y_label: pLDDT
      unit: score
      direction: higher
      missing: 'null'
      y_min: 0
      y_max: 100
  - plugin: matrix
    id: predicted_aligned_error
    role: evidence
    title: Predicted aligned error
    description: Pairwise predicted aligned error for each model; lower values indicate
      greater confidence in relative residue placement.
    sources:
      matrices:
      - glob: '*/pae_*.json'
        required: false
    mapping:
      format: json
      value_path: 0.predicted_aligned_error
      x_label: Aligned residue
      y_label: Scored residue
      unit: "\xC5"
      direction: lower
      scale: sequential
      scale_min: 0
      scale_max: 31.75
stage_markers:
  msa_searching: MSA searching
  featuring: Building features
  modeling: Folding models
  relaxing: Amber relaxation
workflow:
- name: features
  display_name: MSA and features
  requires_gpu: false
  runner_args:
  - -s
  - features
  stage_markers:
  - msa_searching
  - featuring
- name: model
  display_name: Model and relax
  requires_gpu: true
  runner_args:
  - -s
  - model
  stage_markers:
  - modeling
  - relaxing
id: alphafold
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    model_preset:
      type: string
      default: monomer
      enum:
      - monomer
      - monomer_casp14
      - monomer_ptm
      - multimer
    max_template_date:
      type: string
      default: '2021-11-01'
    num_multimer_predictions_per_model:
      type: integer
      default: 1
      minimum: 1
      maximum: 20
    db_preset:
      type: string
      default: full_dbs
      enum:
      - full_dbs
    models_to_relax:
      type: string
      default: best
      enum:
      - none
      - best
      - all
    benchmark:
      type: boolean
      default: false
