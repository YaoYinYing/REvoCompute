    deterministic:
      type: boolean
      description: Select the most likely synonymous codon at every position.
      default: true
    temperature:
      type: number
      description: Sampling temperature used when deterministic generation is disabled.
      default: 0.2
      exclusiveMinimum: 0
      maximum: 2.0
    top_p:
      type: number
      description: Nucleus-sampling probability threshold used for variable generation.
      default: 0.95
      exclusiveMinimum: 0
      maximum: 1.0
    num_sequences:
      type: integer
      description: Number of coding sequences to sample; deterministic mode requires
        one.
      default: 1
      minimum: 1
      maximum: 100
    match_protein:
      type: boolean
      description: Restrict every sampled token to codons that translate to the supplied
        protein.
      default: true
    attention_type:
      type: string
      description: BigBird attention implementation; block-sparse reduces memory use
        for longer proteins.
      default: original_full
      enum:
      - original_full
      - block_sparse
    seed:
      type: integer
      description: Random seed controlling variable sequence generation.
      default: 0
      minimum: 0
      maximum: 2147483647
