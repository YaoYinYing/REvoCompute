display_name: CodonTransformer codon optimization
category: sequence_design
citation_dois:
- num: 1
  doi: 10.1038/s41467-025-58588-7
  title: 'CodonTransformer: a multispecies codon optimizer using context-aware neural
    networks'
citation_bibtex: '@article{Fallahpour_2025, title={CodonTransformer: a multispecies
  codon optimizer using context-aware neural networks}, volume={16}, ISSN={2041-1723},
  url={http://dx.doi.org/10.1038/s41467-025-58588-7}, DOI={10.1038/s41467-025-58588-7},
  number={1}, journal={Nature Communications}, publisher={Springer Science and Business
  Media LLC}, author={Fallahpour, Adibvafa and Gureghian, Vincent and Filion, Guillaume
  J. and Lindner, Ariel B. and Pandi, Amir}, year={2025}, month=Apr }'
summary: Generate host-specific coding DNA for one protein with CodonTransformer.
use_when: Use this to design synonymous coding sequences for expression in one of
  the organisms supported by the model.
input_summary: One protein sequence as FASTA.
output_summary: Coding DNA sequences in FASTA plus machine-readable prediction metadata.
considerations:
- Codon optimization is a model prediction and does not guarantee expression yield.
- The selected organism must exactly match a name supported by the pinned model.
- Input proteins are limited to 2,046 residues because the pinned upstream inference
  path uses 2,048 tokens including delimiters.
input_extension: .fasta
input_label: Protein FASTA
input_workspace:
  steps:
  - id: material
    title: Provide the protein sequence
    description: Upload or paste exactly one protein sequence
    capabilities:
    - plugin: files
      id: source_files
      title: Protein FASTA
      options:
        primary_required: true
    - plugin: sequence
      id: sequence_editor
      title: Protein sequence
  - id: settings
    title: Set the experiment
    description: Select the host and sequence-generation controls
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Codon optimization settings
  - id: review
    title: Review and run
    description: Check the sequence, host, and sampling settings
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: evidence-bundle
    id: codon_optimization_results
    role: primary
    title: Optimized coding sequences
    description: Generated DNA sequences and the exact scientific parameter record.
    sources:
      items:
      - glob: optimized_sequences.fasta
        required: true
      - glob: results.json
        required: true
    mapping: {}
stage_markers:
  codon_optimize: CodonTransformer inference
id: codon_optimize
