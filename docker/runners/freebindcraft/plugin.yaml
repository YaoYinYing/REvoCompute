api_version: 1
id: freebindcraft
version: '1'
runtime:
  image_artifact: freebindcraft_v1.sif
  definition: freebindcraft.def
  build_inputs:
  - freebindcraft/run.sh
  # Family adapter code is still baked here; migration to runtime_overlay is deferred (docs/runner-guide/runtime-bundles.md).
  runtime_overlay:
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/freebindcraft/task.yaml
