id: autodock_vina
display_name: AutoDock Vina
category: docking
summary: Classical CPU structure-based small-molecule docking with the Vina scoring
  function.
use_when: Use this to dock one or more prepared ligands into a receptor binding box.
input_summary: One receptor PDB or PDBQT and one or more ligand SDF, MOL2, or PDBQT files.
output_summary: Native Vina poses and logs with normalized pose scores and run provenance.
considerations:
- Receptor and ligand preparation
- protonation
- and search-box placement remain user responsibilities.
gpus: false
inputs:
  receptor:
    title: Receptor
    type: protein_structure
    cardinality: {min: 1, max: 1}
    formats: [pdb, pdbqt]
  ligands:
    title: Ligands
    type: small_molecule_3d
    cardinality: {min: 1, max: 32}
    formats: [sdf, mol2, pdbqt]
input_workspace:
  steps:
  - id: structures
    title: Provide receptor and ligands
    description: Bind a receptor and prepared ligands to their named slots.
    capabilities:
    - plugin: files
      id: source_files
      title: Docking structures
  - id: settings
    title: Define search box
    description: Set the center dimensions and search effort.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Vina settings
  - id: review
    title: Review and run
    description: Confirm inputs and search settings.
    capabilities:
    - plugin: review
      id: submission_review
      title: Docking review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: docked_poses
    role: primary
    title: Docked poses
    description: Ranked Vina poses.
    sources:
      candidates:
      - glob: vina_*.pdbqt
        required: true
      supporting:
      - path: scores.csv
        required: true
    mapping: {}
  - plugin: evidence-bundle
    id: docking_run
    role: evidence
    title: Run record
    description: Inputs and resolved parameters.
    sources:
      items:
      - path: vina-run.json
        required: true
      - path: summary.json
        required: true
    mapping: {}
stage_markers:
  prepare: Prepare receptor and ligands
  dock: Vina pose search
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    center_x:
      type: number
      description: Search-box center X coordinate in angstroms.
      default: 0.0
    center_y:
      type: number
      description: Search-box center Y coordinate in angstroms.
      default: 0.0
    center_z:
      type: number
      description: Search-box center Z coordinate in angstroms.
      default: 0.0
    size_x:
      type: number
      description: Search-box size along X in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 200.0
    size_y:
      type: number
      description: Search-box size along Y in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 200.0
    size_z:
      type: number
      description: Search-box size along Z in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 200.0
    exhaustiveness:
      type: integer
      description: Number of independent Vina search iterations.
      default: 8
      minimum: 1
      maximum: 64
    num_modes:
      type: integer
      description: Maximum number of output binding modes.
      default: 9
      minimum: 1
      maximum: 20
    seed:
      type: integer
      description: Random seed for reproducible Vina searches.
      default: 1
      minimum: 1
      maximum: 2147483647
      x-ui-control:
        kind: seed
        random:
          minimum: 1
citation_dois:
- num: 1
  doi: 10.1021/acs.jcim.1c00203
  title: AutoDock Vina 1.2.0 new docking methods expanded force field and Python bindings
citation_bibtex: '@article{Eberhardt_2021, title={AutoDock Vina 1.2.0: New Docking
  Methods, Expanded Force Field, and Python Bindings}, volume={61}, ISSN={1549-960X},
  url={http://dx.doi.org/10.1021/acs.jcim.1c00203}, DOI={10.1021/acs.jcim.1c00203},
  number={8}, journal={Journal of Chemical Information and Modeling}, publisher={American
  Chemical Society (ACS)}, author={Eberhardt, Jerome and Santos-Martins, Diogo and
  Tillack, Andreas F. and Forli, Stefano}, year={2021}, month=July, pages={3891–3898}
  }'
