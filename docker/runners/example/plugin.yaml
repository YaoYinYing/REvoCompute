api_version: 1
id: example
version: '1'
name: Example sequence statistics
runtime:
  image_artifact: example_v1.sif
  definition: example.def
  # The SIF installs an environment and nothing else: a Python base image with
  # no REvoCompute code.  Everything this family executes is declared below and
  # delivered as an immutable, content-addressed Runtime Bundle mounted at
  # /opt/revocompute/runtime.
  #
  # Change .def or a dependency   -> rebuild the SIF (BUILD_STALE)
  # Change a runtime_overlay file -> reuse the SIF, revalidate (VALIDATION_STALE)
  # Change the task contract      -> reuse the SIF, revalidate (VALIDATION_STALE)
  # Change presentation metadata  -> neither
  build_inputs: []
  runtime_overlay:
    - common/runtime/
    - example/run.sh
    - example/analyze.py
  entrypoint: [bash, /opt/revocompute/runtime/example/run.sh]
tasks: [tasks/sequence_statistics/task.yaml]
