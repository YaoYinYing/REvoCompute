id: sequence_statistics
display_name: Protein sequence statistics
category: analysis
summary: Calculate deterministic length, molecular-weight, and amino-acid composition statistics for protein sequences.
use_when: Use this reference task to inspect one or more protein sequences without a model, database, or accelerator.
input_summary: One FASTA file containing one or more unaligned protein sequences.
output_summary: Per-sequence statistics in TSV and JSON for every committed work item, plus a task-level rollup.
considerations:
- Molecular weights use average residue masses, include one water molecule for peptide termini,
  and approximate ambiguous residues.
- Each FASTA record is an independent work item. A record that cannot be analyzed fails alone
  and the remaining records still produce results.
- This task reports descriptive sequence properties and does not predict structure, function, or experimental behavior.
inputs:
  sequence:
    title: Protein sequences
    type: protein_sequence
    cardinality: {min: 1, max: 1}
    formats: [fasta, fa, faa]
input_workspace:
  steps:
  - id: material
    title: Provide protein sequences
    description: Upload or paste one or more unaligned protein sequences.
    capabilities:
    - plugin: files
      id: source_files
      title: Protein FASTA
    - plugin: sequence
      id: sequence_editor
      title: Protein sequences
      options: {role: sequence}
  - id: settings
    title: Set output precision
    description: Choose the number of decimal places used for molecular weights.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Statistics settings
  - id: review
    title: Review and run
    description: Check the sequences and output setting before creating the Task.
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options: {show_paths: true}
result_workspace:
  views:
  - plugin: evidence-bundle
    id: sequence_statistics_table
    role: primary
    title: Sequence statistics
    description: Tab-separated per-sequence lengths, molecular weights, and amino-acid counts, one table per work item.
    sources:
      items:
      - glob: '*/sequence_statistics.tsv'
        required: true
    mapping: {}
  - plugin: scalar-summary
    id: aggregate_summary
    role: evidence
    title: Input summary
    description: Aggregate record and residue counts over the committed work items.
    sources:
      data:
      - path: task_summary.json
        required: true
    mapping:
      fields:
      - {path: sequence_count, label: Sequences, unit: sequences, direction: neutral}
      - {path: succeeded_count, label: Succeeded, unit: sequences, direction: neutral}
      - {path: failed_count, label: Failed, unit: sequences, direction: neutral}
      - {path: total_residues, label: Total residues, unit: residues, direction: neutral}
stage_markers:
  model_loading: Loading the analysis runtime
  sequence_statistics: Analyzing sequence records
# The runner-owned fallback vocabulary, declared here as executable
# documentation. Allowed adjustment keys are the execution-only set owned by
# `revocompute/resource_model.py`, and a plan naming anything else is rejected
# when this manifest loads. This CPU-only task has no memory dimension to adapt,
# so `observe` is the only meaningful stage; the plan shows the shape rather
# than addressing a real constraint. SimpleFold and ESMFold 2 declare the plans
# they enforce.
resource_adaptation:
  stage: observe
  fallback_plans:
  - label: serial
    title: One work item at a time
    adjustments: {batch_size: 1}
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    mass_precision:
      type: integer
      description: Number of decimal places used to report molecular weights in daltons.
      default: 2
      minimum: 0
      maximum: 6
