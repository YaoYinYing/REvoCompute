id: rfdiffusion2_motif_scaffold
display_name: RFdiffusion2 atomic motif scaffolding
category: design
summary: Generate protein backbones around indexed or position-agnostic atomic motifs with RFdiffusion2.
use_when: Use this to scaffold an enzyme active site or another atomic protein motif supplied in an ORI-annotated PDB.
input_summary: One PDB containing the motif, molecular context, and an RFdiffusion2 ORI centering token.
output_summary: Designed PDB backbones, RFdiffusion2 TRB metadata, optional denoising trajectories, and exact input/model provenance.
considerations:
- The PDB must contain an ORI HETATM whose coordinates define the center of the generated region.
- Contig residue identifiers and atom names must match the uploaded PDB exactly.
- Generated structures require sequence design, structure prediction, and experimental validation downstream.
gpus: true
input_extension: .pdb
input_extensions: [.pdb]
primary_input_extensions: [.pdb]
allow_multiple_inputs: false
max_input_files: 1
input_label: ORI-annotated atomic motif PDB
input_workspace:
  steps:
  - id: material
    title: Provide the atomic motif
    description: Upload the motif structure with its ORI centering token.
    capabilities:
    - plugin: files
      id: source_files
      title: Motif PDB
      options: {primary_required: true}
    - plugin: structure
      id: structure_summary
      title: Inspect the motif and ligand
      options: {source: source_files, select_chains: false, select_residues: false}
  - id: settings
    title: Set the design controls
    description: Define contigs, atom constraints, placement mode, and bounded sampling.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Scaffolding settings
  - id: review
    title: Review and run
    description: Check the motif specification and sampling cost.
    capabilities:
    - plugin: review
      id: submission_review
      title: Scaffolding review
      options: {show_paths: true}
result_workspace:
  views:
  - plugin: candidate-collection
    id: designed_backbones
    role: primary
    title: Designed motif scaffolds
    description: RFdiffusion2 protein backbones containing the requested atomic motif.
    sources:
      candidates:
      - glob: design_*.pdb
        required: true
    mapping: {}
  - plugin: evidence-bundle
    id: design_evidence
    role: evidence
    title: Trajectories and provenance
    description: RFdiffusion2 mappings, optional trajectories, normalized run settings, and model identity.
    sources:
      items:
      - glob: design_*.trb
        required: true
      - glob: traj/*.pdb
        required: false
      - path: rfdiffusion2-run.json
        required: true
      - path: rfdiffusion2-model-assets.sha256
        required: true
    mapping: {}
stage_markers:
  rfdiffusion2_motif_scaffold: RFdiffusion2 atomic motif scaffolding
citation_dois:
- num: 1
  doi: 10.1101/2025.04.09.648075
  title: Atom level enzyme active site scaffolding using RFdiffusion2
citation_bibtex: '@article{Ahern_2025, title={Atom level enzyme active site scaffolding using RFdiffusion2},
  DOI={10.1101/2025.04.09.648075}, publisher={Cold Spring Harbor Laboratory}, author={Ahern,
  Woody and Yim, Jason and Tischer, Doug and Salike, Saman and Woodbury, Seth M and Kim, Donghyo
  and Kalvet, Indrek and Kipnis, Yakov and Coventry, Brian and Altae-Tran, Han Raut and others},
  year={2025}, month=Apr}'
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [contig]
  properties:
    contig:
      type: string
      description: Comma-separated generated-length and chain-qualified motif segments, for example 46,A106-106,59,A166-166,25.
      pattern: '^(?:[0-9]+(?:-[0-9]+)?|[A-Za-z][1-9][0-9]*-[1-9][0-9]*)(?:,(?:[0-9]+(?:-[0-9]+)?|[A-Za-z][1-9][0-9]*-[1-9][0-9]*))*$'
      minLength: 1
      maxLength: 2048
    contig_atoms:
      type: string
      description: Atomic motif selections as residue:atoms entries separated by semicolons or newlines, for example A106:NE,CD,CZ;A166:OD1,CG.
      default: ''
      maxLength: 4096
      pattern: "^(?:[A-Za-z][1-9][0-9]*:[A-Za-z0-9][A-Za-z0-9']{0,3}(?:,[A-Za-z0-9][A-Za-z0-9']{0,3})*(?:(?:;|\\r?\\n)[A-Za-z][1-9][0-9]*:[A-Za-z0-9][A-Za-z0-9']{0,3}(?:,[A-Za-z0-9][A-Za-z0-9']{0,3})*)*)?$"
    ligand:
      type: string
      description: Optional comma-separated PDB residue names for ligands retained as design context.
      default: ''
      pattern: '^(?:[A-Za-z0-9]{1,3}(?:,[A-Za-z0-9]{1,3})*)?$'
    motif_placement:
      type: string
      description: Keep motif sequence positions indexed or let RFdiffusion2 choose their scaffold positions.
      default: unindexed
      enum: [unindexed, indexed]
    num_designs:
      type: integer
      description: Number of independently sampled scaffold backbones.
      default: 1
      minimum: 1
      maximum: 10
    diffusion_steps:
      type: integer
      description: Number of flow-matching denoising steps; the released model uses 100 by default.
      default: 100
      minimum: 1
      maximum: 100
    num_recycles:
      type: integer
      description: Number of model recycling passes per denoising step.
      default: 1
      minimum: 1
      maximum: 4
    seed:
      type: integer
      description: First deterministic seed used for design sampling.
      default: 0
      minimum: 0
      maximum: 2147483647
    write_trajectory:
      type: boolean
      description: Write denoised and predicted-coordinate multi-model PDB trajectories; these can be large.
      default: false
