display_name: ProteinMPNN
citation_dois:
- num: 1
  doi: 10.1126/science.add2187
  title: Robust deep learning–based protein sequence design using ProteinMPNN
category: inverse_folding
summary: ProteinMPNN sequence design for the given backbone.
use_when: Use this for general sequence design conditioned on a supplied protein backbone.
input_summary: One protein backbone in PDB format.
output_summary: Designed FASTA sequences and optional scores or residue probabilities.
considerations:
- Generated sequences require structural and experimental evaluation.
input_extension: .pdb
input_label: Protein backbone (PDB)
input_workspace:
  steps:
  - id: material
    title: Provide the structure
    description: Choose the structure that defines the molecular context
    capabilities:
    - plugin: files
      id: source_files
      title: Structure files
      options:
        primary_required: true
    - plugin: structure
      id: structure_summary
      title: Inspect the structure
      options:
        source: source_files
        select_chains: false
        select_residues: false
  - id: settings
    title: Set the experiment
    description: Define the design or analysis settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the structure and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: designed_sequences
    role: primary
    title: Designed sequences
    description: Designed sequences in the order published by the MPNN runner.
    sources:
      candidates:
      - glob: seqs/*.fa
        required: true
    mapping: {}
stage_markers:
  proteinmpnn: ProteinMPNN sequence design
id: proteinmpnn
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    num_seq_per_target:
      type: integer
      description: Total number of sequences designed for each input backbone.
      default: 100
      minimum: 1
      maximum: 10000
    sampling_temp:
      type: string
      description: Space-separated sequence sampling temperatures; larger values increase
        amino-acid diversity.
      default: '0.1'
    model_name:
      type: string
      description: ProteinMPNN checkpoint selected by its training backbone-noise
        level.
      default: v_48_020
      enum:
      - v_48_002
      - v_48_010
      - v_48_020
      - v_48_030
    batch_size:
      type: integer
      description: Number of sequence designs sampled together in each inference batch.
      default: 1
      minimum: 1
    seed:
      type: integer
      x-ui-control: {kind: seed, random: {minimum: 1}}
      description: Random seed for reproducible sequence sampling; zero requests upstream
        randomization.
      default: 0
      minimum: 0
    pdb_path_chains:
      type: string
      description: Optional space-separated chain identifiers to redesign; omission
        designs all parsed chains.
      default: ''
    ca_only:
      type: boolean
      description: Uses the alpha-carbon-only ProteinMPNN architecture and matching
        checkpoint.
      default: false
    backbone_noise:
      type: number
      description: Standard deviation in angstroms of Gaussian noise added to backbone
        coordinates.
      default: 0.0
      minimum: 0
    max_length:
      type: integer
      description: Maximum total parsed chain length accepted by the model.
      default: 200000
      minimum: 1
    omit_AAs:
      type: string
      description: One-letter amino-acid codes excluded globally from sequence sampling.
      default: X
    save_score:
      type: integer
      description: Writes per-sequence model scores when enabled.
      default: 0
      enum:
      - 0
      - 1
    save_probs:
      type: integer
      description: Writes sampled, log-probability, and decoding-order arrays when
        enabled.
      default: 0
      enum:
      - 0
      - 1
    score_only:
      type: integer
      description: Scores supplied input sequences without generating new designs
        when enabled.
      default: 0
      enum:
      - 0
      - 1
    conditional_probs_only:
      type: integer
      description: Outputs conditional amino-acid probabilities instead of sampled
        sequences.
      default: 0
      enum:
      - 0
      - 1
    conditional_probs_only_backbone:
      type: integer
      description: Conditions probability output only on backbone coordinates rather
        than sequence context.
      default: 0
      enum:
      - 0
      - 1
    unconditional_probs_only:
      type: integer
      description: Outputs unconditional amino-acid probabilities without autoregressive
        sequence context.
      default: 0
      enum:
      - 0
      - 1
    suppress_print:
      type: integer
      description: Suppresses routine upstream progress output when enabled.
      default: 0
      enum:
      - 0
      - 1
citation_bibtex: '@article{Dauparas_2022, title={Robust deep learning–based protein
  sequence design using ProteinMPNN}, volume={378}, ISSN={1095-9203}, url={http://dx.doi.org/10.1126/science.add2187},
  DOI={10.1126/science.add2187}, number={6615}, journal={Science}, publisher={American
  Association for the Advancement of Science (AAAS)}, author={Dauparas, J. and Anishchenko,
  I. and Bennett, N. and Bai, H. and Ragotte, R. J. and Milles, L. F. and Wicky, B.
  I. M. and Courbet, A. and de Haas, R. J. and Bethel, N. and Leung, P. J. Y. and
  Huddy, T. F. and Pellock, S. and Tischer, D. and Chan, F. and Koepnick, B. and Nguyen,
  H. and Kang, A. and Sankaran, B. and Bera, A. K. and King, N. P. and Baker, D.},
  year={2022}, month=Oct, pages={49–56} }'
