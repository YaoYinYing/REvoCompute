display_name: SolubleMPNN
citation_dois:
- num: 1
  doi: 10.1038/s41586-024-07601-y
  title: Computational design of soluble and functional membrane protein analogues
category: inverse_folding
summary: Solubility-aware ProteinMPNN sequence design.
use_when: Use this when sequence design should use ProteinMPNN checkpoints tuned for
  soluble proteins.
input_summary: One soluble-protein backbone in PDB format.
output_summary: Designed FASTA sequences from a soluble-protein checkpoint.
considerations:
- The soluble-protein prior does not guarantee expression or solubility.
input_extension: .pdb
input_label: Soluble protein backbone (PDB)
input_workspace:
  steps:
  - id: material
    title: Provide the structure
    description: Choose the structure that defines the molecular context
    capabilities:
    - plugin: files
      id: source_files
      title: Structure files
      options:
        primary_required: true
    - plugin: structure
      id: structure_summary
      title: Inspect the structure
      options:
        source: source_files
        select_chains: false
        select_residues: false
  - id: settings
    title: Set the experiment
    description: Define the design or analysis settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the structure and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: designed_sequences
    role: primary
    title: Designed sequences
    description: Designed sequences in the order published by the MPNN runner.
    sources:
      candidates:
      - glob: seqs/*.fa
        required: true
    mapping: {}
stage_markers:
  solublempnn: SolubleMPNN sequence design
id: solublempnn
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    num_seq_per_target:
      type: integer
      description: Total number of soluble-protein sequences designed for each input
        backbone.
      default: 100
      minimum: 1
      maximum: 10000
    sampling_temp:
      type: string
      description: Space-separated sequence sampling temperatures; larger values increase
        amino-acid diversity.
      default: '0.1'
    model_name:
      type: string
      description: Soluble ProteinMPNN checkpoint selected by its training backbone-noise
        level.
      default: v_48_020
      enum:
      - v_48_010
      - v_48_020
    batch_size:
      type: integer
      description: Number of sequence designs sampled together in each inference batch.
      default: 1
      minimum: 1
    seed:
      type: integer
      x-ui-control: seed
      description: Random seed for reproducible sequence sampling; zero requests upstream
        randomization.
      default: 0
      minimum: 0
    pdb_path_chains:
      type: string
      description: Optional space-separated chain identifiers to redesign; omission
        designs all parsed chains.
      default: ''
    backbone_noise:
      type: number
      description: Standard deviation in angstroms of Gaussian noise added to backbone
        coordinates.
      default: 0.0
      minimum: 0
    max_length:
      type: integer
      description: Maximum total parsed chain length accepted by the model.
      default: 200000
      minimum: 1
    omit_AAs:
      type: string
      description: One-letter amino-acid codes excluded globally from sequence sampling.
      default: X
    save_score:
      type: integer
      description: Writes per-sequence model scores when enabled.
      default: 0
      enum:
      - 0
      - 1
    save_probs:
      type: integer
      description: Writes sampled, log-probability, and decoding-order arrays when
        enabled.
      default: 0
      enum:
      - 0
      - 1
    score_only:
      type: integer
      description: Scores supplied input sequences without generating new designs
        when enabled.
      default: 0
      enum:
      - 0
      - 1
    conditional_probs_only:
      type: integer
      description: Outputs conditional amino-acid probabilities instead of sampled
        sequences.
      default: 0
      enum:
      - 0
      - 1
    conditional_probs_only_backbone:
      type: integer
      description: Conditions probability output only on backbone coordinates rather
        than sequence context.
      default: 0
      enum:
      - 0
      - 1
    unconditional_probs_only:
      type: integer
      description: Outputs unconditional amino-acid probabilities without autoregressive
        sequence context.
      default: 0
      enum:
      - 0
      - 1
    suppress_print:
      type: integer
      description: Suppresses routine upstream progress output when enabled.
      default: 0
      enum:
      - 0
      - 1
citation_bibtex: '@article{Goverde_2024, title={Computational design of soluble and
  functional membrane protein analogues}, volume={631}, ISSN={1476-4687}, url={http://dx.doi.org/10.1038/s41586-024-07601-y},
  DOI={10.1038/s41586-024-07601-y}, number={8020}, journal={Nature}, publisher={Springer
  Science and Business Media LLC}, author={Goverde, Casper A. and Pacesa, Martin and
  Goldbach, Nicolas and Dornfeld, Lars J. and Balbi, Petra E. M. and Georgeon, Sandrine
  and Rosset, Stéphane and Kapoor, Srajan and Choudhury, Jagrity and Dauparas, Justas
  and Schellhaas, Christian and Kozlov, Simon and Baker, David and Ovchinnikov, Sergey
  and Vecchio, Alex J. and Correia, Bruno E.}, year={2024}, month=June, pages={449–458}
  }'
