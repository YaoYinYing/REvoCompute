display_name: ThermoMPNN-D
citation_dois:
- num: 1
  doi: 10.1002/pro.70003
  title: Protein stability models fail to capture epistatic interactions of double
    point mutations
category: fitness
summary: Stability change (ΔΔG) prediction for single and double mutants (ThermoMPNN-D).
use_when: Use this to estimate stability changes for single mutations or nearby double
  mutations.
input_summary: One PDB structure and the chain IDs to analyze.
output_summary: Predicted ΔΔG tables for the selected single- or double-mutant mode.
considerations:
- Double-mutant results depend on the selected mode and Cα distance cutoff.
input_extension: .pdb
input_label: PDB file
input_workspace:
  steps:
  - id: material
    title: Provide the structure
    description: Choose the structure that defines the molecular context
    capabilities:
    - plugin: files
      id: source_files
      title: Structure files
      options:
        primary_required: true
    - plugin: structure
      id: structure_summary
      title: Inspect the structure
      options:
        source: source_files
        select_chains: false
        select_residues: false
  - id: settings
    title: Set the experiment
    description: Define the design or analysis settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the structure and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: entity-table
    id: stability_scores
    role: primary
    title: Predicted mutation stability changes
    description: Mutations passing the configured threshold and their predicted stability
      changes; lower ΔΔG is more favourable.
    sources:
      table:
      - path: thermompnn.csv
        required: true
    mapping:
      entity: mutation
      key_columns:
      - Mutation
      label_column: Mutation
      evidence_columns:
      - ddG (kcal/mol)
stage_markers:
  thermompnn: ThermoMPNN-D stability prediction
id: thermompnn
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    chains:
      type: string
      description: Space-separated structure chain identifiers included in stability
        scoring.
      default: A
    mode:
      type: string
      description: Scores single substitutions, additive combinations, or explicit
        epistatic combinations.
      default: single
      enum:
      - single
      - additive
      - epistatic
    batch_size:
      type: integer
      description: Number of mutations evaluated together in each inference batch.
      default: 256
      minimum: 1
    threshold:
      type: number
      description: Predicted stability-change cutoff used to select mutations for
        combined modes.
      default: -0.5
    distance:
      type: number
      description: Maximum residue separation in angstroms considered when constructing
        epistatic mutation pairs.
      default: 5.0
      minimum: 0
    ss_penalty:
      type: boolean
      description: Applies the upstream secondary-structure penalty to mutation scores.
      default: false
citation_bibtex: '@article{Dieckhaus_2024, title={Protein stability models fail to
  capture epistatic interactions of double point mutations}, volume={34}, ISSN={1469-896X},
  url={http://dx.doi.org/10.1002/pro.70003}, DOI={10.1002/pro.70003}, number={1},
  journal={Protein Science}, publisher={Wiley}, author={Dieckhaus, Henry and Kuhlman,
  Brian}, year={2024}, month=Dec }'
