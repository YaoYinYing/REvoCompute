display_name: HyperMPNN
category: inverse_folding
summary: Thermostable sequence design using hyperthermophile-trained ProteinMPNN weights
  (HyperMPNN).
use_when: Use this to sample backbone-compatible sequences with HyperMPNN weights
  trained on hyperthermophile proteins.
input_summary: One protein backbone in PDB format.
output_summary: Designed FASTA sequences and optional scores or probabilities.
considerations:
- Hyperthermophile-biased weights are a design prior, not a guarantee of thermostability.
input_extension: .pdb
input_label: PDB file
input_workspace:
  steps:
  - id: material
    title: Provide the structure
    description: Choose the structure that defines the molecular context
    capabilities:
    - plugin: files
      id: source_files
      title: Structure files
      options:
        primary_required: true
    - plugin: structure
      id: structure_summary
      title: Inspect the structure
      options:
        source: source_files
        select_chains: false
        select_residues: false
  - id: settings
    title: Set the experiment
    description: Define the design or analysis settings
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Method settings
  - id: review
    title: Review and run
    description: Check the structure and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Experiment review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: candidate-collection
    id: designed_sequences
    role: primary
    title: Designed sequences
    description: Designed sequences in the order published by the MPNN runner.
    sources:
      candidates:
      - glob: seqs/*.fa
        required: true
    mapping: {}
stage_markers:
  hypermpnn: HyperMPNN thermostable design
id: hypermpnn
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    num_seq_per_target:
      type: integer
      description: Total number of sequences designed for each input backbone.
      default: 100
      minimum: 1
      maximum: 10000
    sampling_temp:
      type: string
      description: Space-separated sequence sampling temperatures; larger values increase amino-acid diversity.
      default: '0.1'
    batch_size:
      type: integer
      description: Number of sequence designs sampled together in each inference batch.
      default: 1
      minimum: 1
    seed:
      type: integer
      description: Random seed for reproducible sequence sampling; zero requests upstream randomization.
      default: 0
      minimum: 0
    pdb_path_chains:
      type: string
      description: Optional space-separated chain identifiers to redesign; omission designs all parsed chains.
      default: ''
    backbone_noise:
      type: number
      description: Standard deviation in angstroms of Gaussian noise added to backbone coordinates.
      default: 0.0
      minimum: 0
    max_length:
      type: integer
      description: Maximum total parsed chain length accepted by the model.
      default: 200000
      minimum: 1
    omit_AAs:
      type: string
      description: One-letter amino-acid codes excluded globally from sequence sampling.
      default: X
    save_score:
      type: integer
      description: Writes per-sequence model scores when enabled.
      default: 0
      enum:
      - 0
      - 1
    save_probs:
      type: integer
      description: Writes sampled, log-probability, and decoding-order arrays when enabled.
      default: 0
      enum:
      - 0
      - 1
    score_only:
      type: integer
      description: Scores supplied input sequences without generating new designs when enabled.
      default: 0
      enum:
      - 0
      - 1
    conditional_probs_only:
      type: integer
      description: Outputs conditional amino-acid probabilities instead of sampled sequences.
      default: 0
      enum:
      - 0
      - 1
    conditional_probs_only_backbone:
      type: integer
      description: Conditions probability output only on backbone coordinates rather than sequence context.
      default: 0
      enum:
      - 0
      - 1
    unconditional_probs_only:
      type: integer
      description: Outputs unconditional amino-acid probabilities without autoregressive sequence context.
      default: 0
      enum:
      - 0
      - 1
    suppress_print:
      type: integer
      description: Suppresses routine upstream progress output when enabled.
      default: 0
      enum:
      - 0
      - 1
