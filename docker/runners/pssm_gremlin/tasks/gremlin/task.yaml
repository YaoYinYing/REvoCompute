display_name: PSSM-GREMLIN
category: evolution
citations:
- num: 1
  doi: 10.1073/pnas.1314045110
  bibtex: >-
    @article{Kamisetty_2013, title={Assessing the utility of coevolution-based residue–residue contact predictions in a sequence- and structure-rich era}, volume={110}, ISSN={1091-6490}, url={http://dx.doi.org/10.1073/pnas.1314045110}, DOI={10.1073/pnas.1314045110}, number={39}, journal={Proceedings of the National Academy of Sciences}, publisher={National Academy of Sciences}, author={Kamisetty, Hetunandan and Ovchinnikov, Sergey and Baker, David}, year={2013}, month=Sept, pages={15674–15679} }
- num: 2
  doi: 10.1093/nar/25.17.3389
  bibtex: >-
    @article{Altschul_1997, title={Gapped BLAST and PSI-BLAST: a new generation of protein database search programs}, volume={25}, ISSN={1362-4962}, url={http://dx.doi.org/10.1093/nar/25.17.3389}, DOI={10.1093/nar/25.17.3389}, number={17}, journal={Nucleic Acids Research}, publisher={Oxford University Press (OUP)}, author={Altschul, S.}, year={1997}, month=Sept, pages={3389–3402} }

summary: Sequence conservation (PSI-BLAST PSSM) and co-evolutionary couplings (GREMLIN)
  for a protein sequence.
use_when: Use this to identify conserved positions and co-evolving residue pairs from
  one protein sequence.
input_summary: One protein sequence as FASTA, either uploaded or pasted.
output_summary: A multiple-sequence alignment, a PSI-BLAST position-specific scoring
  matrix, and GREMLIN coupling data.
considerations:
- Results depend on homolog coverage in the configured sequence databases.
inputs:
  sequence:
    title: Protein sequence
    type: protein_sequence
    cardinality: {min: 1, max: 1}
    formats: [fasta]
input_workspace:
  steps:
  - id: material
    title: Provide the input
    description: Choose the scientific input for this experiment
    capabilities:
    - plugin: files
      id: source_files
      title: FASTA input
    - plugin: sequence
      id: sequence_editor
      title: Sequence
      description: Upload a FASTA file or paste one protein sequence.
      options: {role: sequence}
  - id: settings
    title: Set the experiment
    description: Adjust only the controls that matter for this run
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: GREMLIN settings
  - id: review
    title: Review and run
    description: Check the input and settings before creating the task snapshot
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options:
        show_paths: true
stage_markers:
  hhblits: HHblits MSA generation
  hhfilter: HHfilter filtering
  gremlin: GREMLIN optimization
  blast: PSI-BLAST PSSM
workflow:
- name: msa
  display_name: MSA search and filtering
  requires_gpu: false
  requires_network: false
  runner_args: ["-s", "msa", "-j", "${allocated_cpus}"]
  stage_markers: [hhblits, hhfilter]
  inputs:
  - {name: sequence, type: protein_sequence, from: "graph:sequence"}
  outputs:
  - {name: alignment, type: alignment, path: "gremlin_msa/*.i90c75_aln.fas"}
- name: fit
  display_name: GREMLIN model fit
  requires_gpu: false
  requires_network: false
  runner_args: ["-s", "fit", "-j", "${allocated_cpus}"]
  stage_markers: [gremlin]
  inputs:
  - {name: alignment, type: alignment, from: "gremlin.msa:alignment"}
  outputs:
  - {name: coupling_model, type: model, path: "gremlin_res/*.GREMLIN.mrf.pkl"}
  - {name: coupling_matrix, type: image, path: "gremlin_res/*_GREMLIN_mtx.png"}
- name: pssm
  display_name: PSI-BLAST PSSM
  requires_gpu: false
  requires_network: false
  runner_args: ["-s", "pssm", "-j", "${allocated_cpus}"]
  stage_markers: [blast]
  inputs:
  - {name: sequence, type: protein_sequence, from: "graph:sequence"}
  outputs:
  - {name: pssm, type: table, path: "pssm_msa/*_ascii_mtx_file"}
id: gremlin
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    iter:
      type: integer
      description: Maximum HHblits iterations used to collect homologous sequences.
      default: 100
      minimum: 1
      maximum: 10000
    evalue:
      type: string
      description: HHblits E-value threshold for accepting database sequence matches.
      default: 1E-10
    mact:
      type: number
      description: HHblits posterior-probability threshold controlling local alignment
        extent.
      default: 0.35
      minimum: 0.0
      maximum: 1.0
    maxfilt:
      type: integer
      description: Maximum number of HHblits prefilter matches passed to full alignment.
      default: 100000000
      minimum: 1
    neffmax:
      type: number
      description: Maximum effective sequence count retained during HHblits diversity
        filtering.
      default: 20.0
      minimum: 1.0
    num_iterations:
      type: integer
      default: 3
      minimum: 1
      maximum: 10
      description: GREMLIN optimization iterations
