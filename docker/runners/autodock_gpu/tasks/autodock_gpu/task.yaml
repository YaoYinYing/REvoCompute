id: autodock_gpu
display_name: AutoDock-GPU
category: docking
summary: GPU-accelerated AutoDock4 docking with Runner-owned AutoGrid map preparation.
use_when: Use this for high-throughput AutoDock4 docking of one or more ligands.
input_summary: One receptor PDB and one or more ligand SDF, MOL2, or PDBQT structures.
output_summary: Native AutoGrid and DLG evidence with normalized AutoDock4 energies and provenance.
considerations:
- Protonation and search-box placement are scientifically consequential and must be
  reviewed before submission.
gpus: true
inputs:
  receptor:
    title: Receptor
    type: protein_structure
    cardinality: {min: 1, max: 1}
    formats: [pdb]
  ligands:
    title: Ligands
    type: small_molecule_3d
    cardinality: {min: 1, max: 64}
    formats: [sdf, mol2, pdbqt]
input_workspace:
  steps:
  - id: structures
    title: Provide receptor and ligands
    description: Bind a receptor and ligands to their named slots.
    capabilities:
    - plugin: files
      id: source_files
      title: Docking structures
  - id: settings
    title: Define grid and search
    description: Set AutoGrid box and independent runs.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: AutoDock-GPU settings
  - id: review
    title: Review and run
    description: Confirm inputs and map bounds.
    capabilities:
    - plugin: review
      id: submission_review
      title: Docking review
      options:
        show_paths: true
result_workspace:
  views:
  - plugin: evidence-bundle
    id: docking_logs
    role: primary
    title: AutoDock4 docking logs
    description: Per-ligand DLG results and AutoGrid log.
    sources:
      items:
      - glob: autodock_gpu_*.dlg
        required: true
      - path: prepared/autogrid.glg
        required: true
      - path: autodock-gpu-run.json
        required: true
      - path: scores.csv
        required: true
      - path: summary.json
        required: true
    mapping: {}
stage_markers:
  maps: AutoGrid affinity map preparation
  dock: AutoDock-GPU search
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    center_x:
      type: number
      description: AutoGrid box center X coordinate in angstroms.
      default: 0.0
    center_y:
      type: number
      description: AutoGrid box center Y coordinate in angstroms.
      default: 0.0
    center_z:
      type: number
      description: AutoGrid box center Z coordinate in angstroms.
      default: 0.0
    size_x:
      type: number
      description: AutoGrid box size along X in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 126.0
    size_y:
      type: number
      description: AutoGrid box size along Y in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 126.0
    size_z:
      type: number
      description: AutoGrid box size along Z in angstroms.
      default: 20.0
      minimum: 1.0
      maximum: 126.0
    nrun:
      type: integer
      description: Number of independent AutoDock4 genetic algorithm runs per ligand.
      default: 20
      minimum: 1
      maximum: 1000
citations:
- num: 1
  doi: 10.1021/acs.jctc.0c01006
  bibtex: >-
    @article{Santos_Martins_2021, title={Accelerating A
    <scp>uto</scp>
    D
    <scp>ock</scp>
    4 with GPUs and Gradient-Based Local Search}, volume={17}, ISSN={1549-9626}, url={http://dx.doi.org/10.1021/acs.jctc.0c01006}, DOI={10.1021/acs.jctc.0c01006}, number={2}, journal={Journal of Chemical Theory and Computation}, publisher={American Chemical Society (ACS)}, author={Santos-Martins, Diogo and Solis-Vasquez, Leonardo and Tillack, Andreas F and Sanner, Michel F and Koch, Andreas and Forli, Stefano}, year={2021}, month=Jan, pages={1060–1073} }
