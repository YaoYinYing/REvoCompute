api_version: 1
id: diffdock
version: '1'
runtime:
  image_artifact: diffdock_v1.sif
  definition: diffdock.def
  build_inputs:
  - diffdock/run.sh
  - diffdock/normalize_results.py
  - diffdock/structure-only.patch
  - diffdock/model-assets.sha256
  - diffdock/esm-assets.sha256
  - diffdock/upstream.json
  # Family adapter code is still baked here; migration to runtime_overlay is deferred (docs/runner-guide/runtime-bundles.md).
  runtime_overlay:
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  entrypoint: [bash, /app/revocompute/run.sh]
tasks: [tasks/diffdock/task.yaml]
