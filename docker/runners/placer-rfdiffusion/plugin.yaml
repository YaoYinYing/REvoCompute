api_version: 1
id: placer-rfdiffusion
version: '1'
runtime:
  docker_image: revodesign-revocompute-runner-placer-rfdiffusion
  slurm_image: /mnt/data/srv/revodesign/server-slurm/images/placer-rfdiffusion_v1.sif
  definition: placer-rfdiffusion.def
  dockerfile: Dockerfile
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/rfdiffusion/task.yaml
- tasks/placer/task.yaml
contributions:
  input_workspace_plugins:
  - id: rfdiffusion-regions
    module: workspace/regions/index.js
    styles:
    - workspace/regions/style.css
