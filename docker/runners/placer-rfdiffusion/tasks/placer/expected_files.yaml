# Logical result files published by the PLACER Task.
#
# PLACER publishes one multi-model PDB with every sample and one CSV whose rows
# score the same samples by model_idx. The complex is the primary view's
# candidate source; the metrics table is the evidence view's table. The task
# takes one protein–ligand complex, so the input snapshot is declared as a
# single-file provenance set.
result:
  files:
    complexes:
      pattern: '*_model.pdb'
      cardinality: one
      required: true
      type: structure
      role: evidence
    model_scores:
      pattern: '*.csv'
      cardinality: one
      required: true
      type: table
      role: evidence
    input_structures:
      pattern: 'debug/inputs/structures/*'
      cardinality: one
      required: true
      type: structure
      role: provenance
    submission:
      path: debug/submission.json
      cardinality: one
      required: true
      type: json
      role: provenance
    citations:
      path: citations.bib
      cardinality: one
      required: true
      type: text
      role: provenance
    execution_records:
      pattern: 'execution/*'
      cardinality: many
      required: true
      type: text
      role: diagnostic
