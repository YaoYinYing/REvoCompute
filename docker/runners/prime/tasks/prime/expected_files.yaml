# Logical result files published by the PRIME growth-temperature Task.
#
# Derived from the production result recorded in the Task's evidence packet:
# one predicted-OGT table with a single row for the input sequence, plus the
# run's sequence, submission, citation and execution provenance.
result:
  files:
    growth_temperature:
      pattern: '*_ogt.csv'
      cardinality: one
      required: true
      type: table
      role: evidence
    input_sequence:
      pattern: 'debug/inputs/sequence/*.fasta'
      cardinality: one
      required: true
      type: fasta
      role: provenance
    submission:
      path: debug/submission.json
      cardinality: one
      required: true
      type: json
      role: provenance
    citations:
      path: citations.bib
      cardinality: one
      required: true
      type: text
      role: provenance
    execution_records:
      pattern: 'execution/*'
      cardinality: many
      required: true
      type: text
      role: diagnostic
