api_version: 1
id: prime
version: '1'
runtime:
  image_artifact: prime_v1.sif
  definition: prime.def
  build_inputs:
  - prime/model-code.sha256
  - prime/run.sh
  # Family adapter code is still baked here; migration to runtime_overlay is deferred (docs/runner-guide/runtime-bundles.md).
  runtime_overlay:
  - common/runtime/task_context.sh
  - common/runtime/task_context.py
  entrypoint:
  - bash
  - /app/revocompute/run.sh
tasks:
- tasks/prime/task.yaml
- tasks/prime_dms/task.yaml
