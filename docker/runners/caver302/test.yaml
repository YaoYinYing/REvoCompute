version: 1
collections:
  smoke:
    cases:
    - id: caver-1suo-heme-tunnels
      task: caver
      input:
        roles:
          structure: [tests/data/pdb/1SUO.pdb]
      parameters:
        # The heme iron is the documented, exemplified starting_point_atom path
        # and the classic 1SUO tunnel-analysis site. The iron sits in a pocket
        # narrower than probe_radius, so the start-point optimisation must be
        # allowed to reach a solvent-accessible vertex; with the default
        # max_distance 3 CAVER finds no tunnels at all.
        start_point_mode: atom
        start_chain: A
        start_residue_number: 500
        start_atom_name: FE
        max_distance: 5
    - id: caver-1suo-group-coordinates-only
      task: caver
      input:
        roles:
          structure: [tests/data/pdb/1SUO_coordinates_only.pdb]
      parameters:
        # A 54-column coordinates-only PDB through the group start point: covers
        # the minimum coordinate block CAVER reads and a chain:residue group
        # centroid in the same heme pocket as the atom-mode baseline.
        start_point_mode: group
        start_group: "A:436,A:438"
