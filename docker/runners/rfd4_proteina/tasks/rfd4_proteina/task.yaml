display_name: RFD4 Proteina conditioned design
category: structure_generation
summary: Generate candidate protein backbones and sequences conditioned on a bounded motif/scaffold specification.
use_when: Use for computationally conditioned backbone and sequence generation.
input_summary: A YAML or JSON condition specification and optional structure input.
output_summary: Generated structures and computational condition-satisfaction results.
considerations:
- Condition satisfaction is computational and does not demonstrate biochemical activity, binding, or function.
- Motif positions and contig grammar are validated before invoking the upstream program.
- Model assets are provisioned separately at /mnt/db/weights/rfd4-proteina; the Task fails closed when they are missing.
inputs:
  condition:
    title: Condition specification
    type: text
    cardinality: {min: 1, max: 1}
    formats: [yaml, yml, json]
  scaffold:
    title: Optional scaffold structure
    type: protein_structure
    cardinality: {min: 0, max: 1}
    formats: [cif, mmcif, pdb]
input_workspace:
  steps:
  - id: material
    title: Provide conditions
    description: Supply a condition document and optional scaffold.
    capabilities:
    - plugin: files
      id: source_files
      title: Condition and scaffold files
  - id: settings
    title: Set generation parameters
    description: Choose bounded generation settings.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Generation settings
  - id: review
    title: Review and run
    description: Review the condition and resolved settings.
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options: {show_paths: true}
result_workspace:
  views:
  - plugin: evidence-bundle
    id: condition_metrics
    role: primary
    title: Condition satisfaction
    description: Computational condition satisfaction for generated candidates; not evidence of biochemical activity.
    sources:
      data:
      - path: condition_metrics.json
        required: true
    mapping: {}
stage_markers:
  model_loading: Loading RFD4 model assets
  generation: Generating conditioned candidates
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    num_designs:
      type: integer
      description: Number of candidate designs to generate.
      default: 1
      minimum: 1
      maximum: 8
    steps:
      type: integer
      description: Number of diffusion steps.
      default: 200
      minimum: 1
      maximum: 500
    seed:
      type: integer
      description: Reproducibility seed.
      default: 0
      minimum: 0
      maximum: 2147483647
