id: rfd4_proteina
display_name: RFD4 Proteina conditioned design
category: structure_generation
summary: Generate conditioned protein backbone and sequence candidates with the pinned RFD4 Hydra interface.
use_when: Use for motif or scaffold generation from a native RFD4 condition specification or annotated CIF.
input_summary: One native YAML/JSON condition specification or annotated CIF, with an optional scaffold structure for specifications.
output_summary: Native annotated CIF designs; no inline metrics are selected in this bounded mode.
considerations:
- Condition satisfaction is computational and does not demonstrate biochemical activity, binding, or function.
- Motif positions and contig grammar are validated before invoking the upstream program.
- Model assets are provisioned separately at /mnt/db/weights/rfd4-proteina; the Task fails closed when they are missing.
inputs:
  condition:
    title: Native condition specification or annotated CIF
    type: text
    cardinality: {min: 1, max: 1}
    formats: [yaml, yml, json, cif, mmcif]
  scaffold:
    title: Optional CIF scaffold for a condition specification
    type: protein_structure
    cardinality: {min: 0, max: 1}
    formats: [cif, mmcif]
input_workspace:
  steps:
  - id: material
    title: Provide conditions
    description: Supply a native condition specification with its scaffold, or an annotated CIF.
    capabilities:
    - plugin: files
      id: source_files
      title: Condition and scaffold files
  - id: settings
    title: Set generation parameters
    description: Choose bounded generation settings.
    capabilities:
    - plugin: parameters
      id: task_parameters
      title: Generation settings
  - id: review
    title: Review and run
    description: Review the condition and resolved settings.
    capabilities:
    - plugin: review
      id: submission_review
      title: Review
      options: {show_paths: true}
result_workspace:
  views:
  - plugin: structure
    id: generated_designs
    role: primary
    title: Generated designs
    description: Native annotated CIF designs. Condition satisfaction is computational and not evidence of biochemical activity.
    sources:
      structure:
      - glob: inference_samples/*/*.cif
        required: true
    mapping: {}
stage_markers:
  model_loading: Loading RFD4 model assets
  generation: Generating conditioned candidates
gpus: true
parameters:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    num_designs:
      type: integer
      description: Number of candidate designs to generate.
      default: 1
      minimum: 1
      maximum: 8
    steps:
      type: integer
      description: Number of diffusion steps.
      default: 200
      minimum: 1
      maximum: 500
    seed:
      type: integer
      description: Reproducibility seed.
      default: 0
      minimum: 0
      maximum: 2147483647
