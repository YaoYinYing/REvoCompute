# Logical result files published by the FrustraMPNN Task.
#
# Derived from the production result recorded in the Task's evidence packet: one
# site-saturation frustration table (every position × every substitution), plus
# the input structure, submission, citation and execution provenance.
result:
  files:
    frustration_predictions:
      path: frustration_predictions.csv
      cardinality: one
      required: true
      type: table
      role: evidence
    input_structure:
      pattern: 'debug/inputs/structure/*.pdb'
      cardinality: one
      required: true
      type: structure
      role: provenance
    submission:
      path: debug/submission.json
      cardinality: one
      required: true
      type: json
      role: provenance
    citations:
      path: citations.bib
      cardinality: one
      required: true
      type: text
      role: provenance
    execution_records:
      pattern: 'execution/*'
      cardinality: many
      required: true
      type: text
      role: diagnostic
