id: fasta_inspect
display_name: Inspect FASTA
summary: Report bounded sequence identifiers, lengths, alphabet validity, and duplicate identifiers.
guidance: Inspection reads sequence content without modifying or normalizing it.
version: "1"
runtime_family: bioio
inputs:
  sequence:
    type: protein_sequence
    formats: [fasta]
    cardinality: {min: 1, max: 1}
outputs:
  inspection:
    type: inspection
    formats: [json]
    cardinality: {min: 1, max: 1}
parameters:
  type: object
  additionalProperties: false
timeout_seconds: 60
