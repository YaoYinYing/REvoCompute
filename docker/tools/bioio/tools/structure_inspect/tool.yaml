id: structure_inspect
display_name: Inspect protein structure
summary: Report bounded structural metadata without changing the input.
guidance: Use to inspect PDB or mmCIF models, chains, residues, atoms, waters, hetero residues, and alternate locations.
version: "1"
runtime_family: bioio
inputs:
  structure:
    type: protein_structure
    formats: [pdb, mmcif]
    cardinality: {min: 1, max: 1}
outputs:
  inspection:
    type: inspection
    formats: [json]
    cardinality: {min: 1, max: 1}
parameters:
  type: object
  additionalProperties: false
timeout_seconds: 60
