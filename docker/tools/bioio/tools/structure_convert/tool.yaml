id: structure_convert
display_name: Convert protein structure
summary: Explicitly convert one protein structure between PDB and mmCIF.
guidance: Conversion preserves the original input and rejects structures that cannot be represented safely in the requested format.
version: "1"
runtime_family: bioio
inputs:
  structure:
    type: protein_structure
    formats: [pdb, mmcif]
    cardinality: {min: 1, max: 1}
outputs:
  structure:
    type: protein_structure
    formats: [pdb, mmcif]
    cardinality: {min: 1, max: 1}
parameters:
  type: object
  additionalProperties: false
  required: [output_format]
  properties:
    output_format:
      type: string
      enum: [pdb, mmcif]
timeout_seconds: 120
