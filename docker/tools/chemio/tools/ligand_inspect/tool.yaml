id: ligand_inspect
display_name: Inspect ligand records
summary: Report bounded molecule, atom, charge, coordinate, and metal metadata without altering chemistry.
guidance: Use for SDF or MOL2 inspection; malformed records are reported explicitly.
version: "1"
runtime_family: chemio
inputs:
  ligand:
    type: small_molecule
    formats: [sdf, mol2]
    cardinality: {min: 1, max: 1}
outputs:
  inspection:
    type: inspection
    formats: [json]
    cardinality: {min: 1, max: 1}
parameters:
  type: object
  additionalProperties: false
timeout_seconds: 90
